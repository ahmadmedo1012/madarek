<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- r183-B2: neutral Madarek favicon, derived from the platform mark
       (public/brand/madarek-mark.svg — the brain/AI shield with a gold
       accent dot). Replaces the retired mini ZU-crest favicon; the crest
       itself stays on disk at /brand/zu-mark.svg as showcase-data
       provenance. No CSP impact: index.html is untouched — its hash pins
       only the two inline <script> blocks. -->
  <defs>
    <linearGradient id="f-mark" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2952C8"/>
      <stop offset="1" stop-color="#5B3CA8"/>
    </linearGradient>
  </defs>
  <!-- shield silhouette -->
  <path d="M16 2 L28 5.5 L28 16 C28 23 23 28 16 30 C9 28 4 23 4 16 L4 5.5 Z" fill="url(#f-mark)"/>
  <!-- brain hemisphere (organic, left) -->
  <path d="M14 11 C11 11 9.5 13 10 15 C8.5 15.5 8.5 17.5 10 18 C9 19.5 10.5 21 12.5 21 C13.5 22.5 15 22.4 15 21 L15 11 Z" fill="#FFFFFF" fill-opacity="0.92"/>
  <!-- AI hemisphere (circuit, right) -->
  <path d="M18 11 C21 11 22.5 13 22 15 C23.5 15.5 23.5 17.5 22 18 C23 19.5 21.5 21 19.5 21 C18.5 22.5 17 22.4 17 21 L17 11 Z" fill="#FFFFFF" fill-opacity="0.5"/>
  <!-- center divider -->
  <line x1="16" y1="10" x2="16" y2="24" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="1.1" stroke-linecap="round"/>
  <!-- circuit nodes on the AI side -->
  <circle cx="19.5" cy="14.5" r="1" fill="#FFFFFF"/>
  <circle cx="19.5" cy="17.5" r="1" fill="#FFFFFF"/>
  <!-- gold accent dot at top -->
  <circle cx="16" cy="6" r="1.5" fill="#D4A537"/>
</svg>
