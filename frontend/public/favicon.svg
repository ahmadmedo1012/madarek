<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- r188: the Madarek khatam-star favicon (8-pointed star + gold
       point of light) in the platform copper→gold accent — the same
       mark as public/brand/madarek-mark.svg, thickened for 16px.
       No CSP impact: index.html is untouched — its hash pins only the
       two inline <script> blocks. -->
  <defs>
    <linearGradient id="f-star" x1="7" y1="7" x2="25" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B57438"/>
      <stop offset="1" stop-color="#E9B44C"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="16" height="16" fill="none" stroke="url(#f-star)" stroke-width="2.6" stroke-linejoin="round"/>
  <rect x="8" y="8" width="16" height="16" fill="none" stroke="url(#f-star)" stroke-width="2.6" stroke-linejoin="round" transform="rotate(45 16 16)"/>
  <rect x="12.5" y="12.5" width="7" height="7" fill="url(#f-star)" transform="rotate(45 16 16)"/>
  <circle cx="23.5" cy="8.5" r="2.6" fill="#E9B44C"/>
</svg>
