<?xml version="1.0" encoding="UTF-8"?>
<!-- r368 T3 — the intro media plate, AUTHORED SVG (pipeline class (a)).
     Tuned to the reference's measured 8x8 luminance map (entry state):
       col1 face 176–197 (x12–25% · rows1–4) · core col2 122–133 / col3 70–84
       (x25–50% · rows1–4, fading r5) · shoulder cols4–5 107–119 (x50–75% ·
       rows1–2, fading r3–4) · disc 62%w·23%h·Ø33%w · bottom band 212–220
       (x37–75% · row7). Original Madarek-owned artwork — measured
       style/geometry parameters only, no reference asset involved. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 713 723" width="713" height="723" role="img" aria-label="رسم أصلي: برج معرفي عمودي بشرائح رأسية على ورق دافئ، ودائرة جمرٍ تلامس كتفه الأيمن">
  <defs>
    <pattern id="faceHatch" width="14" height="723" patternUnits="userSpaceOnUse">
      <rect width="14" height="723" fill="#b5b3a9"/>
      <rect x="4" width="2.5" height="723" fill="#8a887f"/>
      <rect x="9" width="1.5" height="723" fill="#a29f95"/>
    </pattern>
    <pattern id="coreLeftHatch" width="13" height="723" patternUnits="userSpaceOnUse">
      <rect width="13" height="723" fill="#7d7b72"/>
      <rect x="3" width="5" height="723" fill="#4b4a44"/>
      <rect x="9" width="1.5" height="723" fill="#69675f"/>
    </pattern>
    <pattern id="coreRightHatch" width="13" height="723" patternUnits="userSpaceOnUse">
      <rect width="13" height="723" fill="#4d4c47"/>
      <rect x="3" width="5" height="723" fill="#242320"/>
      <rect x="9" width="1.5" height="723" fill="#3d3c38"/>
    </pattern>
    <pattern id="shoulderHatch" width="15" height="723" patternUnits="userSpaceOnUse">
      <rect width="15" height="723" fill="#6b6961"/>
      <rect x="4" width="4" height="723" fill="#3a3934"/>
      <rect x="9" width="1.5" height="723" fill="#57564f"/>
    </pattern>
    <linearGradient id="topLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1efe6" stop-opacity="0.38"/>
      <stop offset="0.13" stop-color="#f1efe6" stop-opacity="0.22"/>
      <stop offset="0.3" stop-color="#f1efe6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94928a" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#b0aea4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d4d2c7" stop-opacity="0.25"/>
    </linearGradient>
    <pattern id="paper" width="46" height="46" patternUnits="userSpaceOnUse">
      <rect width="46" height="46" fill="#f1efe6"/>
      <rect x="0" y="0" width="46" height="1" fill="#e9e7dc"/>
      <rect x="23" y="23" width="1" height="46" fill="#e9e7dc"/>
    </pattern>
    <pattern id="bandHatch" width="26" height="723" patternUnits="userSpaceOnUse">
      <rect width="26" height="723" fill="#d2d0c6"/>
      <rect x="7" width="1.5" height="723" fill="#b4b2a8"/>
      <rect x="16" width="1" height="723" fill="#c3c1b7"/>
    </pattern>
  </defs>

  <!-- the paper ground -->
  <rect width="713" height="723" fill="url(#paper)"/>

  <!-- the tall wedge tower (measured silhouette + shading) -->
  <g>
    <!-- light left face: x12–25% · rows1–4 (176–197) -->
    <rect x="86" y="88" width="89" height="362" fill="url(#faceHatch)"/>
    <!-- core left: x25–37% · rows1–4 (122–133) -->
    <rect x="175" y="88" width="92" height="362" fill="url(#coreLeftHatch)"/>
    <!-- core right (darkest): x37–50% · rows1–4 (70–84) -->
    <rect x="267" y="88" width="86" height="362" fill="url(#coreRightHatch)"/>
    <!-- wide dark shoulder: x50–75% · rows1–2 (107–119) -->
    <rect x="353" y="88" width="181" height="92" fill="url(#shoulderHatch)"/>
    <!-- the fade: rows3–5 below the shoulder (148→201) -->
    <rect x="353" y="180" width="181" height="360" fill="url(#fadeGrad)"/>
    <!-- slot windows in the core (ink slots, the drafting language) -->
    <g stroke="#2b2a26" stroke-width="2" opacity="0.85">
      <line x1="192" y1="112" x2="192" y2="430"/>
      <line x1="214" y1="112" x2="214" y2="430"/>
      <line x1="236" y1="112" x2="236" y2="430"/>
      <line x1="258" y1="112" x2="258" y2="430"/>
      <line x1="280" y1="112" x2="280" y2="430"/>
      <line x1="302" y1="112" x2="302" y2="430"/>
      <line x1="324" y1="112" x2="324" y2="430"/>
      <line x1="346" y1="112" x2="346" y2="430"/>
    </g>
    <!-- shoulder slots -->
    <g stroke="#26251f" stroke-width="1.5" opacity="0.8">
      <line x1="378" y1="100" x2="378" y2="168"/>
      <line x1="400" y1="100" x2="400" y2="168"/>
      <line x1="422" y1="100" x2="422" y2="168"/>
      <line x1="444" y1="100" x2="444" y2="168"/>
      <line x1="466" y1="100" x2="466" y2="168"/>
      <line x1="488" y1="100" x2="488" y2="168"/>
      <line x1="510" y1="100" x2="510" y2="168"/>
    </g>
    <!-- the core's measured bottom fade (r5: 203/156) -->
    <rect x="175" y="450" width="178" height="90" fill="url(#fadeGrad)" opacity="0.55"/>
    <!-- the plinth: the measured ground hairline -->
    <rect x="86" y="540" width="448" height="3" fill="#8f8d85"/>
    <!-- the measured top-light overlay (r1 lighter across the tower) -->
    <rect x="86" y="88" width="448" height="90" fill="url(#topLight)"/>
  </g>

  <!-- the ember disc: measured centroid 62%w · 23%h · Ø 33%w -->
  <circle cx="442" cy="166" r="118" fill="#fa3600"/>
  <circle cx="442" cy="166" r="118" fill="none" stroke="#e42f00" stroke-width="2"/>

  <!-- the measured bottom band (x37–75% · row7, 212–220) -->
  <rect x="267" y="634" width="267" height="86" fill="url(#bandHatch)"/>

  <!-- fine hairline furniture (the plate language's quiet marks) -->
  <g stroke="#d5d3c8" stroke-width="1">
    <line x1="560" y1="40" x2="560" y2="683"/>
    <line x1="574" y1="40" x2="574" y2="683"/>
    <line x1="0" y1="40" x2="713" y2="40"/>
    <line x1="0" y1="683" x2="713" y2="683"/>
  </g>
  <!-- the plate's gutter index (mono annotation, quiet) -->
  <g font-family="ui-monospace, monospace" font-size="11" fill="#a9a79d">
    <text x="8" y="700" direction="ltr">PLATE M-102</text>
    <text x="640" y="700" direction="ltr">[01]</text>
  </g>
</svg>
