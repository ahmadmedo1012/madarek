<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="University of Zawia — جامعة الزاوية">
  <!--
    Official emblem of University of Zawia, recreated from the official badge.
    Composition:
      - Rounded blue badge frame (UoZ corporate blue)
      - Stylized Arabic word "اقرأ" (Read — first divine command in Quran)
      - Gold ribbon underneath inscribed "1980" (founding year)
  -->
  <defs>
    <linearGradient id="zu-blue" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1F4D9B"/>
      <stop offset="1" stop-color="#163A7A"/>
    </linearGradient>
    <linearGradient id="zu-gold-rib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D4A537"/>
      <stop offset="1" stop-color="#9F7218"/>
    </linearGradient>
  </defs>

  <!-- Outer rounded badge frame -->
  <rect x="6" y="6" width="52" height="52" rx="12" fill="#FFFFFF" stroke="url(#zu-blue)" stroke-width="2.5"/>

  <!-- Inner blue field -->
  <rect x="10" y="10" width="44" height="36" rx="8" fill="url(#zu-blue)"/>

  <!--
    Stylized "اقرأ" calligraphy (Iqra' = Read).
    Built from custom strokes to honour the official emblem aesthetic
    without infringing typeface licences. White on blue field.
  -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- alif (ا) -->
    <path d="M19 18 L19 36"/>
    <!-- qaf (ق) — body + dots -->
    <path d="M26 24 Q26 36 32 36 Q38 36 38 30 L38 24"/>
    <circle cx="32" cy="20" r="1.4" fill="#FFFFFF"/>
    <circle cx="35" cy="20" r="1.4" fill="#FFFFFF"/>
    <!-- ra (ر) -->
    <path d="M44 24 Q47 30 43 36"/>
    <!-- final hamza-bearing alif (أ) — vertical with hamza on top -->
    <path d="M51 18 L51 36"/>
    <path d="M50 16 Q52 14 53 16" stroke-width="2"/>
  </g>

  <!-- Gold ribbon strip — founding year "1980" -->
  <g>
    <!-- Ribbon body -->
    <path d="M14 46 L50 46 L52 50 L50 54 L14 54 L12 50 Z" fill="url(#zu-gold-rib)" stroke="#7A560E" stroke-width="0.4"/>
    <!-- 1980 numerals -->
    <text x="32" y="52.4" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="6.5"
          font-weight="700"
          fill="#FFFFFF"
          letter-spacing="0.4">1980</text>
  </g>

  <!-- Subtle bottom shadow under ribbon -->
  <ellipse cx="32" cy="58" rx="18" ry="1.2" fill="#000000" opacity="0.10"/>
</svg>
