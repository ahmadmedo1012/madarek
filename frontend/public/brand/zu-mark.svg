<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="منصة الزاوية للتعليم الذكي">
  <!--
    Mark inspired by the official 'منصة الزاوية للتعليم الذكي' logo:
      - Mosque-arch silhouette in deep navy → teal gradient
      - Open book at the centre
      - Sparkle / star above the book
      - Circuit dot accents along the arch (smart-learning signal)
  -->
  <defs>
    <linearGradient id="zu-arch" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#0E3F6C"/>
      <stop offset="0.5" stop-color="#2479A8"/>
      <stop offset="1"   stop-color="#3FB6C9"/>
    </linearGradient>
    <linearGradient id="zu-arch-deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#082C52"/>
      <stop offset="1" stop-color="#0E3F6C"/>
    </linearGradient>
    <linearGradient id="zu-book" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FB6C9"/>
      <stop offset="1" stop-color="#1F7FA7"/>
    </linearGradient>
    <radialGradient id="zu-sparkle" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE694"/>
      <stop offset="1" stop-color="#F5B845"/>
    </radialGradient>
  </defs>

  <!-- Outer mosque-arch silhouette -->
  <path
    d="M32 4
       C 22 4, 14 12, 14 22
       L 14 56
       C 14 58, 16 60, 18 60
       L 46 60
       C 48 60, 50 58, 50 56
       L 50 22
       C 50 12, 42 4, 32 4 Z"
    fill="url(#zu-arch)"
    stroke="#082C52"
    stroke-width="0.8"/>

  <!-- Inner darker recess to give depth -->
  <path
    d="M32 9
       C 24.5 9, 18.5 15, 18.5 22.5
       L 18.5 55.5
       L 45.5 55.5
       L 45.5 22.5
       C 45.5 15, 39.5 9, 32 9 Z"
    fill="url(#zu-arch-deep)"/>

  <!-- Circuit accents — small dots along the arch (smart learning signal) -->
  <g fill="#3FB6C9">
    <circle cx="20" cy="18" r="1.1"/>
    <circle cx="44" cy="18" r="1.1"/>
    <circle cx="17" cy="32" r="1.1"/>
    <circle cx="47" cy="32" r="1.1"/>
    <circle cx="17" cy="46" r="1.1"/>
    <circle cx="47" cy="46" r="1.1"/>
  </g>

  <!-- Open book at centre -->
  <g transform="translate(32, 38)">
    <!-- Book base -->
    <path d="M-12 4 L-12 -2 Q-12 -4 -10 -4 L-1 -4 L0 -3 L1 -4 L10 -4 Q12 -4 12 -2 L12 4 L0 5 Z"
          fill="url(#zu-book)" stroke="#082C52" stroke-width="0.6"/>
    <line x1="0" y1="-3" x2="0" y2="5" stroke="#082C52" stroke-width="0.6"/>
    <!-- Page lines -->
    <line x1="-9" y1="-1" x2="-3" y2="-1" stroke="#082C52" stroke-width="0.45" opacity="0.65"/>
    <line x1="-9" y1="1.2"  x2="-3" y2="1.2"  stroke="#082C52" stroke-width="0.45" opacity="0.65"/>
    <line x1="3"  y1="-1" x2="9"  y2="-1" stroke="#082C52" stroke-width="0.45" opacity="0.65"/>
    <line x1="3"  y1="1.2"  x2="9"  y2="1.2"  stroke="#082C52" stroke-width="0.45" opacity="0.65"/>
  </g>

  <!-- Sparkle above the book -->
  <g transform="translate(32, 26)">
    <path d="M0 -4.5 L1 -1 L4.5 0 L1 1 L0 4.5 L-1 1 L-4.5 0 L-1 -1 Z"
          fill="url(#zu-sparkle)"/>
  </g>
</svg>
