<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="شعار منصّة مدارك">
  <!--
    مدارك — رمز النجمة الثمانية (r188).
    The independent Madarek mark: an eight-pointed khatam star (two
    rotated squares — a deep Arabic geometric motif for knowledge and
    assembly) stroked in the platform's copper→gold accent ramp, with
    one solid gold point of light at the north-east tip — the «نقطة»
    the brand copy begins from: «كلّ معرفة تبدأ نقطة وتصبح مدارًا».
    Replaces the r183 brain/AI shield. No university imagery.
  -->
  <defs>
    <linearGradient id="mdk-star" x1="14" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B57438"/>
      <stop offset="1" stop-color="#E9B44C"/>
    </linearGradient>
  </defs>
  <!-- khatam star: axis square + the same square rotated 45° about the center -->
  <rect x="17" y="17" width="30" height="30" fill="none" stroke="url(#mdk-star)" stroke-width="3" stroke-linejoin="round"/>
  <rect x="17" y="17" width="30" height="30" fill="none" stroke="url(#mdk-star)" stroke-width="3" stroke-linejoin="round" transform="rotate(45 32 32)"/>
  <!-- the solid core: a filled diamond (the 45° square, shrunk) -->
  <rect x="26.5" y="26.5" width="11" height="11" fill="url(#mdk-star)" transform="rotate(45 32 32)"/>
  <!-- نقطة — the point of light at the north-east star tip (47,17) -->
  <circle cx="47" cy="17" r="4.5" fill="#E9B44C"/>
  <circle cx="47" cy="17" r="7.5" fill="#E9B44C" fill-opacity="0.18"/>
</svg>
