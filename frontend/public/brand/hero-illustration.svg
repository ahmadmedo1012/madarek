<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="600" height="480" role="img" aria-label="منصة مدارك للتعليم الذكي">
  <defs>
    <!-- Background gradient — academic depth -->
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1629" />
      <stop offset="0.5" stop-color="#1A2540" />
      <stop offset="1" stop-color="#0A0E1A" />
    </linearGradient>

    <!-- Gold accent gradient -->
    <linearGradient id="hero-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD166" />
      <stop offset="1" stop-color="#F5B845" />
    </linearGradient>

    <!-- Blue accent gradient -->
    <linearGradient id="hero-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A9EFF" />
      <stop offset="1" stop-color="#2563EB" />
    </linearGradient>

    <!-- Purple accent for AI -->
    <linearGradient id="hero-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA" />
      <stop offset="1" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Soft glow for nodes -->
    <radialGradient id="hero-glow-gold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5B845" stop-opacity="0.40" />
      <stop offset="1" stop-color="#F5B845" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="hero-glow-blue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4A9EFF" stop-opacity="0.30" />
      <stop offset="1" stop-color="#4A9EFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Frame -->
  <rect width="600" height="480" rx="24" fill="url(#hero-bg)"/>

  <!-- Soft background mesh dots -->
  <g opacity="0.4">
    <circle cx="80"  cy="60"  r="1.5" fill="#4A9EFF"/>
    <circle cx="540" cy="120" r="1.5" fill="#F5B845"/>
    <circle cx="160" cy="380" r="1.5" fill="#8B5CF6"/>
    <circle cx="510" cy="420" r="1.5" fill="#4A9EFF"/>
    <circle cx="320" cy="40"  r="1.5" fill="#F5B845"/>
    <circle cx="40"  cy="280" r="1.5" fill="#8B5CF6"/>
  </g>

  <!-- Aurora glows -->
  <ellipse cx="120" cy="120" rx="160" ry="120" fill="url(#hero-glow-blue)"/>
  <ellipse cx="480" cy="380" rx="180" ry="140" fill="url(#hero-glow-gold)"/>

  <!-- Central composition: open book with knowledge nodes radiating out -->

  <!-- Open book — base -->
  <g transform="translate(180, 220)">
    <!-- Book pages -->
    <path d="M0 100 L0 30 Q0 10 20 10 L110 10 L120 16 L130 10 L220 10 Q240 10 240 30 L240 100 L130 110 L120 104 L110 110 Z"
          fill="#F8F4E8"
          stroke="#D4C8A8"
          stroke-width="1.2"/>
    <!-- Center fold -->
    <line x1="120" y1="16" x2="120" y2="104" stroke="#C4B89A" stroke-width="1.5"/>
    <!-- Page lines (left) -->
    <line x1="20" y1="35" x2="105" y2="35" stroke="#C4B89A" stroke-width="1" opacity="0.6"/>
    <line x1="20" y1="50" x2="105" y2="50" stroke="#C4B89A" stroke-width="1" opacity="0.6"/>
    <line x1="20" y1="65" x2="95"  y2="65" stroke="#C4B89A" stroke-width="1" opacity="0.6"/>
    <line x1="20" y1="80" x2="105" y2="80" stroke="#C4B89A" stroke-width="1" opacity="0.6"/>
    <!-- Page lines (right) -->
    <line x1="135" y1="35" x2="220" y2="35" stroke="#C4B89A" stroke-width="1" opacity="0.6"/>
    <line x1="135" y1="50" x2="220" y2="50" stroke="#C4B89A" stroke-width="1" opacity="0.6"/>
    <line x1="135" y1="65" x2="210" y2="65" stroke="#C4B89A" stroke-width="1" opacity="0.6"/>
    <line x1="135" y1="80" x2="220" y2="80" stroke="#C4B89A" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Connecting lines from book to floating knowledge cards -->
  <g stroke="#4A9EFF" stroke-width="1.5" opacity="0.50" fill="none">
    <path d="M260 250 Q200 180 140 130"/>
    <path d="M340 240 Q400 170 470 120"/>
    <path d="M260 290 Q200 350 140 390"/>
    <path d="M340 290 Q400 350 470 380"/>
  </g>

  <!-- Floating knowledge cards (4 corners around the book) -->

  <!-- Top-left: AI brain icon -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="100" height="76" rx="12" fill="#1B2547" stroke="#8B5CF6" stroke-width="1.5" opacity="0.95"/>
    <!-- AI icon (simplified brain) -->
    <g transform="translate(50, 28)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="url(#hero-purple)" stroke-width="2"/>
      <circle cx="-5" cy="-4" r="2" fill="#A78BFA"/>
      <circle cx="5"  cy="-2" r="2" fill="#A78BFA"/>
      <circle cx="0"  cy="6"  r="2" fill="#A78BFA"/>
      <line x1="-5" y1="-4" x2="5"  y2="-2" stroke="#8B5CF6" stroke-width="1"/>
      <line x1="5"  y1="-2" x2="0"  y2="6"  stroke="#8B5CF6" stroke-width="1"/>
      <line x1="0"  y1="6"  x2="-5" y2="-4" stroke="#8B5CF6" stroke-width="1"/>
    </g>
    <text x="50" y="62" text-anchor="middle" fill="#A78BFA" font-family="sans-serif" font-size="10" font-weight="600">AI</text>
  </g>

  <!-- Top-right: graduation cap -->
  <g transform="translate(420, 80)">
    <rect x="0" y="0" width="100" height="76" rx="12" fill="#1B2547" stroke="#F5B845" stroke-width="1.5" opacity="0.95"/>
    <!-- Graduation cap -->
    <g transform="translate(50, 30)">
      <path d="M-20 0 L0 -10 L20 0 L0 10 Z" fill="url(#hero-gold)"/>
      <path d="M-14 4 L-14 14 Q0 22 14 14 L14 4" fill="none" stroke="#F5B845" stroke-width="2"/>
      <line x1="20" y1="0" x2="20" y2="14" stroke="#F5B845" stroke-width="1.5"/>
      <circle cx="20" cy="14" r="2" fill="#FFD166"/>
    </g>
    <text x="50" y="62" text-anchor="middle" fill="#F5B845" font-family="sans-serif" font-size="9" font-weight="600">GRAD</text>
  </g>

  <!-- Bottom-left: chart / analytics -->
  <g transform="translate(80, 320)">
    <rect x="0" y="0" width="100" height="76" rx="12" fill="#1B2547" stroke="#4A9EFF" stroke-width="1.5" opacity="0.95"/>
    <!-- Bar chart -->
    <g transform="translate(20, 22)">
      <rect x="0"  y="22" width="10" height="14" rx="1" fill="url(#hero-blue)"/>
      <rect x="14" y="14" width="10" height="22" rx="1" fill="url(#hero-blue)"/>
      <rect x="28" y="6"  width="10" height="30" rx="1" fill="url(#hero-blue)"/>
      <rect x="42" y="0"  width="10" height="36" rx="1" fill="url(#hero-blue)"/>
      <line x1="-2" y1="36" x2="56" y2="36" stroke="#4A9EFF" stroke-width="1"/>
    </g>
    <text x="50" y="62" text-anchor="middle" fill="#4A9EFF" font-family="sans-serif" font-size="10" font-weight="600">DATA</text>
  </g>

  <!-- Bottom-right: connected nodes (network) -->
  <g transform="translate(420, 320)">
    <rect x="0" y="0" width="100" height="76" rx="12" fill="#1B2547" stroke="#10B981" stroke-width="1.5" opacity="0.95"/>
    <!-- Network nodes -->
    <g transform="translate(50, 28)">
      <line x1="0"  y1="-12" x2="-12" y2="0"  stroke="#10B981" stroke-width="1.4"/>
      <line x1="0"  y1="-12" x2="12"  y2="0"  stroke="#10B981" stroke-width="1.4"/>
      <line x1="-12" y1="0"  x2="0"   y2="12" stroke="#10B981" stroke-width="1.4"/>
      <line x1="12"  y1="0"  x2="0"   y2="12" stroke="#10B981" stroke-width="1.4"/>
      <circle cx="0"   cy="-12" r="4" fill="#10B981"/>
      <circle cx="-12" cy="0"   r="4" fill="#10B981"/>
      <circle cx="12"  cy="0"   r="4" fill="#10B981"/>
      <circle cx="0"   cy="12"  r="4" fill="#10B981"/>
    </g>
    <text x="50" y="62" text-anchor="middle" fill="#10B981" font-family="sans-serif" font-size="9" font-weight="600">CONNECT</text>
  </g>

  <!-- Brand mark anchor at top-center -->
  <g transform="translate(300, 50)" opacity="0.95">
    <circle cx="0" cy="0" r="22" fill="url(#hero-gold)"/>
    <text x="0" y="6" text-anchor="middle" fill="#0A0E1A" font-family="sans-serif" font-size="22" font-weight="800">م</text>
  </g>

  <!-- Subtle frame outline -->
  <rect x="0.5" y="0.5" width="599" height="479" rx="24" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
</svg>
