    <!-- Self-hosted IBM Plex (src/styles/fonts.css) — preload the two most
         critical arabic subsets: body 400 + display 700. crossorigin is
         required because fonts are always fetched in CORS mode. -->
    <link rel="preload" href="/fonts/plex-sans-arabic-400-normal-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plex-sans-arabic-700-normal-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function () {
        try {
          /* 23-a (A5 P2-5): resolve the theme BEFORE first paint from
             BOTH localStorage signals —
               1. the theme store ('madarek-theme', zustand persist):
                  the device's own choice + its timestamp, and
               2. 'mdrk-theme-profile': the profile preference cached
                  by useThemeProfileSync on every `me` observation.
             Same rules as the hook: an explicit profile wins over the
             local default ('system'), and a strictly NEWER profile
             wins over a stale stored local choice (the old bootstrap
             painted light and flipped to dark ~1–2s later once `me`
             resolved). A cached 'SYSTEM' means the profile made no
             explicit choice — the local mode governs. */
          var mode = 'dark', modeUpdatedAt = 0; /* r148 (AUDIT-5 M1): كان 'system' —
             زائر جديد بلا localStorage وOS فاتح يُرسم فاتحًا ثم ينقلب داكنًا
             بعد إقلاع React (المخزن الافتراضي 'dark' — theme.store.ts:38
             «night is the flagship») = وميض مرئي على الشبكات البطيئة.
             محاذاة افتراضي السكربت مع افتراضي المخزن تُلغي الانقلاب. */
          try {
            var stored = JSON.parse(localStorage.getItem('madarek-theme'));
            if (stored && stored.state) {
              var st = stored.state;
              if (st.mode === 'dark' || st.mode === 'light' || st.mode === 'system') {
                mode = st.mode;
              }
              if (typeof st.modeUpdatedAt === 'number') modeUpdatedAt = st.modeUpdatedAt;
            }
          } catch (_) {}
          try {
            var prof = JSON.parse(localStorage.getItem('mdrk-theme-profile'));
            if (prof && (prof.pref === 'DARK' || prof.pref === 'LIGHT')
                && (mode === 'system'
                    || (typeof prof.ts === 'number' && prof.ts > modeUpdatedAt))) {
              mode = prof.pref === 'DARK' ? 'dark' : 'light';
            }
          } catch (_) {}
          var resolved = mode === 'dark' || mode === 'light'
            ? mode
            : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'dark'); /* r148 (AUDIT-5 M1): كان 'light' — نفس محاذاة الافتراضي */
        }
        /* r162 (R1) — route-aware boot ground for the landing world.
           The public cold-load of `/` used to paint the PRODUCT ground
           (var(--bg) — cream/night) from the first styled frame through
           the hydration splash while the landing chunk fetched, then
           flipped to the Orbit Ink world — a two-worlds flash at the
           product's front door (harshest in light mode; reproduced live,
           and r161's own honest note carried it as remaining). Pre-React
           we cannot know the router's verdict, but we can know enough:
           pathname `/` + no persisted session means the router will
           serve the landing to a GUEST (HomeRedirect: no user →
           LandingPage). The session store (`mdrk-auth`) lives in
           sessionStorage, partialized to {user, accessToken} — an
           authed reload keeps the product ground and redirects to the
           role home with zero new flash. React owns the attribute once
           the store is hydrated (useLandingBootGround in App.tsx)
           and corrects the heuristic either way; the pre-hydration
           window is the only window where this attribute exists
           without its React owner. */
        try {
          var persistedSession = sessionStorage.getItem('mdrk-auth');
          var hasSessionUser = false;
          if (persistedSession) {
            var parsedSession = JSON.parse(persistedSession);
            hasSessionUser = !!(parsedSession && parsedSession.state && parsedSession.state.user);
          }
          if (location.pathname === '/' && !hasSessionUser) {
            document.documentElement.setAttribute('data-landing-boot', '');
          }
        } catch (_) {}
        /* wave 2-a — theme-color follows the RESOLVED theme (stored
             preference + runtime toggles via useThemeSync), not just the
             OS scheme. The two media-query metas above remain as the
             pre-JS / no-JS baseline; once this script runs they are
             unified to the app's actual theme and kept in sync on every
             data-theme change. */
        var syncThemeColor = function () {
          var color =
            document.documentElement.getAttribute('data-theme') === 'dark'
              ? '#070B16'
              : '#FBFAF9';
          /* r162 (R4): while the landing boot ground owns the page, the
             browser chrome (address-bar tint) follows the Orbit Ink
             world instead of the product theme — the ink landing is the
             landing's ground in BOTH data-themes. Mirrors --ln-ink
             (tokens.css); this script cannot read CSS vars pre-style. */
          if (document.documentElement.hasAttribute('data-landing-boot')) {
            color = '#252A3E';
          }
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) {
            metas[i].removeAttribute('media');
            metas[i].setAttribute('content', color);
          }
        };
        syncThemeColor();
        new MutationObserver(syncThemeColor).observe(
          document.documentElement,
          /* r162 (R1/R4): data-landing-boot toggles (React owner) sync
             the chrome tint the same way theme flips do. */
          { attributes: true, attributeFilter: ['data-theme', 'data-landing-boot'] },
        );
      })();
    </script>
