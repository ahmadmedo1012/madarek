<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#1a1d23" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)" />
    <meta name="description" content="منصة الزاوية للتعليم الذكي — المنصة الرسمية لجامعة الزاوية · وزارة التعليم العالي والبحث العلمي · ليبيا" />
    <title>منصة الزاوية للتعليم الذكي · جامعة الزاوية</title>
    <!-- No-flash theme bootstrap: read stored choice / system pref before paint. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('madarek-theme');
          var pref = stored ? JSON.parse(stored).state.mode : 'system';
          /* Light by default — academic platform is a professional tool.
             Only show dark when the user explicitly requested it OR the OS
             reports prefers-color-scheme: dark. */
          var resolved =
            pref === 'system'
              ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
              : pref;
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
