<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0A1220" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)" />
    <meta name="description" content="مدارك — منصة التعليم الذكي لجامعة الزاوية · وزارة التعليم العالي والبحث العلمي · ليبيا" />
    <title>مدارك · منصة التعليم الذكي · جامعة الزاوية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('madarek-theme');
          var pref = stored ? JSON.parse(stored).state.mode : 'system';
          var resolved;
          if (pref === 'system' || !pref) {
            resolved = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } else if (pref === 'dark' || pref === 'light') {
            resolved = pref;
          } else {
            resolved = 'light';
          }
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
