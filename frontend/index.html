<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#191918" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FBFAF9" media="(prefers-color-scheme: light)" />
    <meta name="description" content="مدارك — منصة التعليم الذكي لجامعة الزاوية · وزارة التعليم العالي والبحث العلمي · ليبيا" />
    <title>مدارك · منصة التعليم الذكي · جامعة الزاوية</title>
    <!-- Self-hosted IBM Plex (src/styles/fonts.css) — preload the two most
         critical arabic subsets: body 400 + display 700. crossorigin is
         required because fonts are always fetched in CORS mode. -->
    <link rel="preload" href="/fonts/plex-sans-arabic-400-normal-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plex-sans-arabic-700-normal-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('madarek-theme');
          var pref = stored ? JSON.parse(stored).state.mode : 'system';
          var resolved;
          if (pref === 'system' || !pref) {
            resolved = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } else if (pref === 'dark' || pref === 'light') {
            resolved = pref;
          } else {
            resolved = 'light';
          }
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
        /* wave 2-a — theme-color follows the RESOLVED theme (stored
             preference + runtime toggles via useThemeSync), not just the
             OS scheme. The two media-query metas above remain as the
             pre-JS / no-JS baseline; once this script runs they are
             unified to the app's actual theme and kept in sync on every
             data-theme change. */
        var syncThemeColor = function () {
          var color =
            document.documentElement.getAttribute('data-theme') === 'dark'
              ? '#191918'
              : '#FBFAF9';
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) {
            metas[i].removeAttribute('media');
            metas[i].setAttribute('content', color);
          }
        };
        syncThemeColor();
        new MutationObserver(syncThemeColor).observe(
          document.documentElement,
          { attributes: true, attributeFilter: ['data-theme'] },
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
