name: Android — release APK/AAB

# Build an installable Android APK and a Play-upload AAB with Gradle.
#
# R350 R2/R3 pipeline: build (Ubuntu) -> verify (Ubuntu, independent) ->
# publish (rolling prerelease `android-latest`), with the emulator smoke
# running HERMETICALLY in parallel (its own Postgres + backend on the job
# runner, reached from the emulator via 10.0.2.2 — the smoke APK's baked
# API base URL points at that local stack, NOT at sleeping production;
# the published release APK keeps the production URL).
#
# Publish policy (R3): the release is replaced whenever build + independent
# verify pass. The smoke result is recorded in build-info.json (smoke:
# pass|fail) and the run summary; a failed smoke turns the run red (loud)
# but must never leave the public APK stale for days. A flaky-infra smoke
# failure retries once inside the job.
#
# Signing:
#   * If ANDROID_KEYSTORE_BASE64 + password/alias secrets exist, the release
#     APK/AAB are signed with that release key.
#   * Otherwise the Expo template's stable debug keystore is used, and the
#     verifier/release notes label the artifact as internal/debug-signed.
#
# The official public Android binary is produced here. Any meaningful change
# affecting the installed app — native inputs AND JavaScript/screens/assets —
# triggers a fresh verified build, so `android-latest` never lags the source.
# A nightly scheduled rebuild is the freshness safety net. (mobile.yml stays
# complementary: gates + OTA delivery of JS-only updates.)

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/app/**"
      - "apps/mobile/src/**"
      - "apps/mobile/package.json"
      - "apps/mobile/package-lock.json"
      - "apps/mobile/app.config.ts"
      - "apps/mobile/app.json"
      - "apps/mobile/eas.json"
      - "apps/mobile/assets/**"
      - "apps/mobile/plugins/**"
      - "apps/mobile/android/**"
      - "apps/mobile/ios/**"
      - "shared/**"
      - "scripts/tokens/**"
      - "scripts/brand/**"
      - "apps/mobile/scripts/**"
      - "scripts/ci/**"
      - "docs/api/openapi.json"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or commit SHA)"
        required: false
        default: "main"
  # R3 — the freshness safety net: even with no mobile-touching commits, a
  # nightly rebuild re-publishes from current main so `android-latest` can
  # never go stale because of a missed trigger.
  schedule:
    - cron: '25 2 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CI: "1"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  ANDROID_COMPILE_SDK: "37"
  ANDROID_MIN_SDK: "24"
  ANDROID_TARGET_SDK: "36"
  ANDROID_BUILD_TOOLS: "37.0.0"
  ANDROID_NDK: "27.1.12297006"
  # Public build-time configuration (same value as eas.json). Not a secret.
  EXPO_PUBLIC_API_BASE_URL: "https://madarek.onrender.com/api/v1"
  EXPO_UPDATES_CHANNEL: "production"
  APK_NAME: "Madarek"
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  build:
    name: Build release APK + AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Configure the preinstalled Android SDK
        # The runner image already ships the SDK + cmdline-tools. Avoid
        # android-actions/setup-android v3 here: its license step hangs/fails
        # with the current cmdline-tools, and our next step accepts licenses
        # non-interactively before installing the exact packages we need.
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_ROOT" ]; then
            for candidate in "$HOME/Android/Sdk" /opt/android-sdk /usr/lib/android-sdk; do
              if [ -d "$candidate" ]; then SDK_ROOT="$candidate"; break; fi
            done
          fi
          test -d "$SDK_ROOT" || { echo "::error::Android SDK not found"; exit 1; }

          SDKMANAGER=""
          for dir in "$SDK_ROOT"/cmdline-tools/*/bin; do
            if [ -x "$dir/sdkmanager" ]; then SDKMANAGER="$dir/sdkmanager"; break; fi
          done
          test -n "$SDKMANAGER" || { echo "::error::sdkmanager not found under $SDK_ROOT"; exit 1; }

          SDKMANAGER_DIR=$(dirname "$SDKMANAGER")
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          export PATH="$SDKMANAGER_DIR:$SDK_ROOT/platform-tools:$PATH"
          command -v sdkmanager
          sdkmanager --version

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not set}"
          # yes can receive SIGPIPE when sdkmanager exits; the license state is
          # still persisted, so don't fail the step on that harmless signal.
          set +o pipefail
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          set -o pipefail
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}.0" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}"
          sdkmanager --sdk_root="$ANDROID_HOME" --list_installed \
            | grep -E "platforms;android-${ANDROID_COMPILE_SDK}\\.0|build-tools;${ANDROID_BUILD_TOOLS}|ndk;${ANDROID_NDK}" \
            || true

      - name: Show toolchain and source revision
        run: |
          set -euo pipefail
          echo "Commit: $(git rev-parse HEAD)"
          echo "Subject: $(git log -1 --pretty=%s)"
          uname -a
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          node -v
          npm -v

      - name: Install JS dependencies from the lockfile
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund

      - name: Typecheck before the native build
        working-directory: apps/mobile
        run: npm run typecheck

      - name: Resolve and validate the Expo config
        working-directory: apps/mobile
        env:
          # R5/R8: the SAME versionCode the prebuild bakes two steps below
          # — run 43531370824 failed verify ("unexpected versionCode: 36")
          # because this resolved config still carried the fallback 1.
          MADAREK_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          mkdir -p build
          npx expo config --type public --json > build/expo-config.json
          node scripts/ci/validate-expo-config.mjs --platform android --config build/expo-config.json
          jq -r '.android.versionCode' build/expo-config.json | grep -qx "$MADAREK_VERSION_CODE"

      - name: Generate the native Android project (Expo prebuild)
        working-directory: apps/mobile
        env:
          # R5: versionCode rides the run number — every publish is
          # strictly newer than the last on the device.
          MADAREK_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          rm -rf android
          npx expo prebuild --platform android --no-install 2>&1 | tee build/prebuild.log
          test -d android
          # prebuild rewrites the local dev scripts to `expo run:*`; restore the
          # managed-workflow scripts so later tooling sees the repository state.
          npm pkg set scripts.android="expo start --android" scripts.ios="expo start --ios"
          echo "Generated native project: android/"

      - name: Tune Gradle for the CI runner and release ABIs
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          GRADLE_PROPERTIES="android/gradle.properties"
          test -f "$GRADLE_PROPERTIES"

          if grep -q '^org.gradle.jvmargs=' "$GRADLE_PROPERTIES"; then
            sed -i 's|^org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8|' "$GRADLE_PROPERTIES"
          else
            echo 'org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8' >> "$GRADLE_PROPERTIES"
          fi

          if grep -q '^reactNativeArchitectures=' "$GRADLE_PROPERTIES"; then
            sed -i 's|^reactNativeArchitectures=.*|reactNativeArchitectures=arm64-v8a,armeabi-v7a|' "$GRADLE_PROPERTIES"
          else
            echo 'reactNativeArchitectures=arm64-v8a,armeabi-v7a' >> "$GRADLE_PROPERTIES"
          fi

          # prebuild can leave the last property without a trailing newline;
          # appending directly would corrupt it (e.g. `[]org.gradle.caching=true`).
          if [ -s "$GRADLE_PROPERTIES" ] && [ -n "$(tail -c 1 "$GRADLE_PROPERTIES")" ]; then
            printf '\n' >> "$GRADLE_PROPERTIES"
          fi
          grep -q '^org.gradle.caching=' "$GRADLE_PROPERTIES" || echo 'org.gradle.caching=true' >> "$GRADLE_PROPERTIES"
          grep -q '^org.gradle.parallel=' "$GRADLE_PROPERTIES" || echo 'org.gradle.parallel=true' >> "$GRADLE_PROPERTIES"
          grep -q '^android.enableMinifyInReleaseBuilds=' "$GRADLE_PROPERTIES" || echo 'android.enableMinifyInReleaseBuilds=true' >> "$GRADLE_PROPERTIES"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties

          echo "== effective Gradle properties =="
          cat "$GRADLE_PROPERTIES"
          echo "sdk.dir=$ANDROID_HOME"

      - name: Compute the expected OTA runtime version
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          # The Gradle expo-updates plugin embeds this fingerprint-style
          # runtime version in assets/fingerprint. EAS Update uses the same
          # computation for the production branch, so an APK/OTA mismatch
          # would silently strand installed builds.
          EXPECTED_RUNTIME_VERSION=$(EXPO_UPDATES_CHANNEL=production npx expo-updates fingerprint:generate --platform android | jq -r .hash)
          test "${#EXPECTED_RUNTIME_VERSION}" -eq 40
          echo "EXPECTED_RUNTIME_VERSION=$EXPECTED_RUNTIME_VERSION" >> "$GITHUB_ENV"
          echo "Expected OTA runtime version: $EXPECTED_RUNTIME_VERSION"

      - name: Configure Android release signing
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/ci/configure-android-signing.mjs

      - name: Build release APK and AAB
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          mkdir -p build
          (cd android && ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace) \
            2>&1 | tee build/gradle.log

      - name: Collect and verify the artifacts
        # MUST run immediately after the multi-ABI release build: the x86_64
        # smoke pass below overwrites app-release.apk at the same Gradle
        # output path, and verify-apk.py would reject its single-ABI lib set
        # (run 20's failure: ABIs ['x86_64'] != ['arm64-v8a','armeabi-v7a']).
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$APK"
          test -f "$AAB"
          cp "$APK" "build/$APK_NAME.apk"
          cp "$AAB" "build/$APK_NAME.aab"
          if [ -f android/app/build/outputs/mapping/release/mapping.txt ]; then
            cp android/app/build/outputs/mapping/release/mapping.txt build/mapping.txt
          fi

          BUILD_TOOLS_VERSION="$ANDROID_BUILD_TOOLS" \
            python3 scripts/verify-apk.py \
              --apk "build/$APK_NAME.apk" \
              --aab "build/$APK_NAME.aab" \
              --json-out build/verify.json \
              --expected-version "$(jq -r .version build/expo-config.json)" \
              --expected-version-code "$(jq -r '.android.versionCode // 1' build/expo-config.json)" \
              --min-sdk "$ANDROID_MIN_SDK" \
              --target-sdk "$ANDROID_TARGET_SDK" \
              --expected-signing-mode "$SIGNING_MODE" \
              --expected-runtime-version "$EXPECTED_RUNTIME_VERSION" \
              | tee build/verify.log

          ACTUAL_COMPILE_SDK=$(jq -r .compile_sdk build/verify.json)
          if [ "$ACTUAL_COMPILE_SDK" != "$ANDROID_COMPILE_SDK" ]; then
            echo "::error::APK compileSdk $ACTUAL_COMPILE_SDK does not match $ANDROID_COMPILE_SDK"
            exit 1
          fi

          if [ "$SIGNING_MODE" = "release" ]; then
            ACTUAL_CERT=$(jq -r .certificate_sha256 build/verify.json)
            if [ "$ACTUAL_CERT" != "${EXPECTED_CERT_SHA256:?}" ]; then
              echo "::error::APK certificate $ACTUAL_CERT does not match keystore $EXPECTED_CERT_SHA256"
              exit 1
            fi
          fi

      - name: Build the x86_64 emulator APK (the smoke's ABI)
        # The release APK carries arm64-v8a + armeabi-v7a (physical
        # devices). The API-34 x86_64 emulator needs its own native
        # libs — a second incremental gradle pass, cached (~1 min).
        # Runs AFTER the multi-ABI artifacts are collected+verified into
        # build/: this pass overwrites app-release.apk at the same Gradle
        # output path (single-ABI lib set), which verify-apk.py rejects.
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          (cd android && ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            -PreactNativeArchitectures=x86_64) 2>&1 | tee build/gradle-x86.log
          cp android/app/build/outputs/apk/release/app-release.apk build/Madarek-x86_64.apk

      - name: Write build metadata and checksums
        working-directory: apps/mobile
        env:
          REQUESTED_REF: ${{ github.event.inputs.ref || github.ref }}
        run: |
          set -euo pipefail
          COMMIT=$(git rev-parse HEAD)
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          GRADLE_VERSION=$(sed -n 's|.*gradle-\([0-9.]*\)-bin.zip.*|\1|p' android/gradle/wrapper/gradle-wrapper.properties)
          JDK_VERSION=$(java -version 2>&1 | head -1)
          CERT_SHA=$(jq -r .certificate_sha256 build/verify.json)

          jq -n \
            --arg platform "android" \
            --arg name "$APK_NAME" \
            --arg apk "$APK_NAME.apk" \
            --arg aab "$APK_NAME.aab" \
            --arg commit "$COMMIT" \
            --arg requested_ref "$REQUESTED_REF" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg event_name "$GITHUB_EVENT_NAME" \
            --arg actor "$GITHUB_ACTOR" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_number "$GITHUB_RUN_NUMBER" \
            --arg run_url "$RUN_URL" \
            --arg runner "ubuntu-24.04" \
            --arg runner_os "$RUNNER_OS" \
            --arg runner_arch "$RUNNER_ARCH" \
            --arg jdk "$JDK_VERSION" \
            --arg java_home "$JAVA_HOME" \
            --arg android_sdk "$ANDROID_COMPILE_SDK" \
            --arg build_tools "$ANDROID_BUILD_TOOLS" \
            --arg ndk "$ANDROID_NDK" \
            --arg gradle "$GRADLE_VERSION" \
            --arg signing_mode "$SIGNING_MODE" \
            --arg certificate_sha256 "$CERT_SHA" \
            --arg node "$(node -v)" \
            --arg npm "$(npm -v)" \
            --arg built_at "$BUILT_AT" \
            --arg updates_channel "${EXPO_UPDATES_CHANNEL:-}" \
            --arg expected_runtime_version "${EXPECTED_RUNTIME_VERSION:?}" \
            '{
              platform: $platform,
              name: $name,
              apk: $apk,
              aab: $aab,
              commit: $commit,
              requested_ref: $requested_ref,
              repository: $repository,
              workflow: $workflow,
              event_name: $event_name,
              actor: $actor,
              run_id: $run_id,
              run_number: $run_number,
              run_url: $run_url,
              runner: $runner,
              runner_os: $runner_os,
              runner_arch: $runner_arch,
              jdk: $jdk,
              java_home: $java_home,
              android_sdk: $android_sdk,
              build_tools: $build_tools,
              ndk: $ndk,
              gradle: $gradle,
              signing_mode: $signing_mode,
              certificate_sha256: $certificate_sha256,
              node: $node,
              npm: $npm,
              built_at: $built_at,
              updates_channel: $updates_channel,
              expected_runtime_version: $expected_runtime_version,
              verified: false
            }' > build/build-env.json

          jq -s '.[0] * .[1]' build/build-env.json build/verify.json > build/build-info.json
          (cd build && sha256sum "$APK_NAME.apk" "$APK_NAME.aab" > SHA256SUMS.txt)

          echo "== build-info.json =="
          cat build/build-info.json
          echo "== SHA256SUMS.txt =="
          cat build/SHA256SUMS.txt

      - name: Upload the APK/AAB candidate
        uses: actions/upload-artifact@v4
        with:
          name: android-release-candidate
          path: |
            apps/mobile/build/Madarek.apk
            apps/mobile/build/Madarek.aab
            apps/mobile/build/Madarek-x86_64.apk
            apps/mobile/build/build-info.json
            apps/mobile/build/SHA256SUMS.txt
            apps/mobile/build/verify.json
            apps/mobile/build/signing.json
            apps/mobile/build/mapping.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Remove temporary signing material
        if: always()
        run: |
          set -euo pipefail
          rm -f "${RUNNER_TEMP}/madarek-release.keystore"
          rm -f apps/mobile/android/key.properties
          echo "Temporary signing material removed"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs-${{ github.run_number }}
          path: |
            apps/mobile/build/prebuild.log
            apps/mobile/build/gradle.log
            apps/mobile/build/gradle-x86.log
            apps/mobile/build/expo-config.json
            apps/mobile/build/verify.log
            apps/mobile/android/gradle.properties
            apps/mobile/android/app/build.gradle
          if-no-files-found: ignore
          retention-days: 14

  smoke:
    # R350 R2 — the HERMETIC crash-regression smoke: its own Postgres
    # (service container) + the real backend built from the same commit,
    # running on this job runner and reached from the emulator via the
    # host-loopback alias 10.0.2.2. The smoke APK is built HERE (x86_64,
    # release parity incl. R8 minification) with EXPO_PUBLIC_API_BASE_URL
    # baked to http://10.0.2.2:4000/api/v1 — the flow measures the APP,
    # never sleeping production and never the Render cold boot (the iOS
    # run 43135742169 died exactly there: tab-courses after login).
    # A second NON-minified x86_64 build is kept ready as a paint-freeze
    # discriminator: if the minified welcome screen never paints but the
    # no-minify probe does, R8 owns the bug (installed only on double
    # failure, never published).
    name: Emulator smoke (API 34, hermetic backend, Maestro alive-flow)
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: madarek
          POSTGRES_PASSWORD: madarek
          POSTGRES_DB: madarek_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U madarek"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The hermetic stack: baked into the smoke APK at Metro bundle time
      # (EXPO_PUBLIC_* inlining) and used by the backend steps below.
      EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:4000/api/v1
      SMOKE_DATABASE_URL: postgresql://madarek:madarek@localhost:5432/madarek_smoke
      SMOKE_JWT_ACCESS_SECRET: ci-only-access-secret-0123456789abcdef0123456789abcdef
      SMOKE_JWT_REFRESH_SECRET: ci-only-refresh-secret-0123456789abcdef0123456789abcd

    steps:
      - name: Checkout (full — backend + mobile + flows)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Configure the preinstalled Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_ROOT" ]; then
            for candidate in "$HOME/Android/Sdk" /opt/android-sdk /usr/lib/android-sdk; do
              if [ -d "$candidate" ]; then SDK_ROOT="$candidate"; break; fi
            done
          fi
          test -d "$SDK_ROOT" || { echo "::error::Android SDK not found"; exit 1; }
          SDKMANAGER=""
          for dir in "$SDK_ROOT"/cmdline-tools/*/bin; do
            if [ -x "$dir/sdkmanager" ]; then SDKMANAGER="$dir/sdkmanager"; break; fi
          done
          test -n "$SDKMANAGER" || { echo "::error::sdkmanager not found under $SDK_ROOT"; exit 1; }
          SDKMANAGER_DIR=$(dirname "$SDKMANAGER")
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          export PATH="$SDKMANAGER_DIR:$SDK_ROOT/platform-tools:$PATH"
          command -v sdkmanager
          sdkmanager --version

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not set}"
          set +o pipefail
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          set -o pipefail
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}.0" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}"

      # ── The hermetic backend stack ──────────────────────────────────

      - name: Install backend dependencies (root workspaces)
        run: npm ci --no-audit --no-fund

      - name: Build the backend
        run: npm run build -w backend

      - name: Migrate + seed the smoke database
        run: |
          set -euo pipefail
          export DATABASE_URL="$SMOKE_DATABASE_URL"
          npm run db:deploy
          npm run db:seed

      - name: Boot the backend (background) and wait for health
        run: |
          set -euo pipefail
          mkdir -p apps/mobile/build
          DATABASE_URL="$SMOKE_DATABASE_URL" \
          JWT_ACCESS_SECRET="$SMOKE_JWT_ACCESS_SECRET" \
          JWT_REFRESH_SECRET="$SMOKE_JWT_REFRESH_SECRET" \
          PORT=4000 \
          MADAREK_TEST_ACCOUNTS=1 \
          GIT_SHA="$(git rev-parse --short HEAD)" \
            nohup node backend/dist/server.js > apps/mobile/build/backend.log 2>&1 &
          echo $! > apps/mobile/build/backend.pid
          for i in $(seq 1 60); do
            BODY=$(curl -s --max-time 3 http://localhost:4000/api/v1/health || true)
            if echo "$BODY" | grep -q '"ok":true'; then
              echo "backend healthy after ${i} probes: $BODY"
              exit 0
            fi
            sleep 2
          done
          echo "::error::backend never became healthy; log tail:"
          tail -50 apps/mobile/build/backend.log
          exit 1

      # ── The smoke APK (x86_64, hermetic URL, release parity) ────────

      - name: Install JS dependencies from the lockfile
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund

      - name: Generate the native Android project (Expo prebuild)
        working-directory: apps/mobile
        env:
          MADAREK_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          rm -rf android
          npx expo prebuild --platform android --no-install 2>&1 | tee build/prebuild-smoke.log
          test -d android
          npm pkg set scripts.android="expo start --android" scripts.ios="expo start --ios"

      - name: Allow cleartext to the local backend (smoke variant only)
        # Release builds block cleartext HTTP by default; the hermetic API
        # base URL is http://10.0.2.2:4000 — this patch touches ONLY the
        # throwaway prebuild tree in this job (the published release APK
        # is built by the build job and keeps production HTTPS).
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST"
          if grep -q 'networkSecurityConfig' "$MANIFEST"; then
            echo "::warning::template ships a networkSecurityConfig — usesCleartextTraffic may be shadowed"
          fi
          sed -i 's|<application |<application android:usesCleartextTraffic="true" |' "$MANIFEST"
          grep -q 'android:usesCleartextTraffic="true"' "$MANIFEST" || { echo "::error::cleartext patch failed"; exit 1; }
          echo "cleartext permitted for the smoke variant"

      - name: Tune Gradle for the CI runner (x86_64 smoke build)
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          GRADLE_PROPERTIES="android/gradle.properties"
          test -f "$GRADLE_PROPERTIES"
          sed -i 's|^org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8|' "$GRADLE_PROPERTIES"
          grep -q '^org.gradle.jvmargs=' "$GRADLE_PROPERTIES" || echo 'org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8' >> "$GRADLE_PROPERTIES"
          if grep -q '^reactNativeArchitectures=' "$GRADLE_PROPERTIES"; then
            sed -i 's|^reactNativeArchitectures=.*|reactNativeArchitectures=x86_64|' "$GRADLE_PROPERTIES"
          else
            echo 'reactNativeArchitectures=x86_64' >> "$GRADLE_PROPERTIES"
          fi
          if [ -s "$GRADLE_PROPERTIES" ] && [ -n "$(tail -c 1 "$GRADLE_PROPERTIES")" ]; then printf '\n' >> "$GRADLE_PROPERTIES"; fi
          grep -q '^org.gradle.caching=' "$GRADLE_PROPERTIES" || echo 'org.gradle.caching=true' >> "$GRADLE_PROPERTIES"
          grep -q '^org.gradle.parallel=' "$GRADLE_PROPERTIES" || echo 'org.gradle.parallel=true' >> "$GRADLE_PROPERTIES"
          # Release parity: the shipped APK is minified — the smoke tests the
          # same code path (and a no-minify discriminator is built below).
          grep -q '^android.enableMinifyInReleaseBuilds=' "$GRADLE_PROPERTIES" || echo 'android.enableMinifyInReleaseBuilds=true' >> "$GRADLE_PROPERTIES"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties

      - name: Build the x86_64 smoke APK (minified, hermetic URL)
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          mkdir -p build
          (cd android && ./gradlew :app:assembleRelease --no-daemon --stacktrace) \
            2>&1 | tee build/gradle-smoke.log
          cp android/app/build/outputs/apk/release/app-release.apk build/Madarek-smoke-x86_64.apk
          test -s build/Madarek-smoke-x86_64.apk

      - name: Build the no-minify discriminator APK
        # Cheap incremental pass (R8 off): if the minified welcome screen
        # never paints but this one does, R8 owns the paint freeze. Never
        # published; only installed on double smoke failure.
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          sed -i 's|^android.enableMinifyInReleaseBuilds=.*|android.enableMinifyInReleaseBuilds=false|' android/gradle.properties
          (cd android && ./gradlew :app:assembleRelease --no-daemon --stacktrace) \
            2>&1 | tee build/gradle-smoke-nominify.log
          cp android/app/build/outputs/apk/release/app-release.apk build/Madarek-smoke-x86_64-nominify.apk
          test -s build/Madarek-smoke-x86_64-nominify.apk

      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # ubuntu-24.04 runners: the runner user is not in the kvm group —
      # without this rule the emulator falls back to full software
      # emulation and "device offline" never resolves (run 16's failure).
      - name: Enable KVM group permissions (ubuntu-24.04)
        run: |
          # R8 fix: the rule previously wrote KERNEL==kvm" (missing opening
          # quote — run 43531370824) so it matched NOTHING: /dev/kvm kept its
          # 0660 kvm-group mode, the emulator fell back to full software
          # emulation (5-minute boot), system_server ANR'd ("Process system
          # isn't responding" over the app) and Maestro never saw a control.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          # Evidence over claims: the emulator process only needs read+write
          # on the node — prove THIS user has it before spending 20 minutes
          # on a software-emulated boot.
          test -r /dev/kvm && test -w /dev/kvm && echo 'KVM node accessible (rw) for this user'

      - name: Run the alive-flow on the emulator (hermetic)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          API_LEVEL: '34'
        with:
          api-level: 34
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          # R8: a real phone panel + headroom. The default AVD is 320x640
          # @160dpi — cramped for an app shipped for 390dp+ screens — and the
          # stock 2-core/2GB VM starved system_server next to the smoke
          # backend stack. Appended config entries win over the defaults
          # (the action's own cores/ram mechanism does exactly this).
          cores: 3
          ram-size: 3072M
          heap-size: 512M
          pre-emulator-launch-script: |
            printf 'hw.lcd.width=1080\nhw.lcd.height=2340\nhw.lcd.density=420\n' >> "$ANDROID_AVD_HOME/test.avd/config.ini"
            grep '^hw.lcd' "$ANDROID_AVD_HOME/test.avd/config.ini"
          # R350 R2: animations ON — the entrance stagger is ~400ms and
          # Maestro waits idly through it; disabling system animations was
          # a variable in the never-painting era, removed from the equation.
          disable-animations: false
          script: |
            # NOTE: android-emulator-runner executes EVERY LINE of this script
            # as its own `/usr/bin/sh -c` (POSIX sh, no pipefail, no variables
            # or cwd surviving across lines) — every line is self-contained.
            adb wait-for-device
            adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done'
            adb shell 'while [ "$(getprop dev.bootcomplete)" != "1" ]; do sleep 2; done'
            adb shell wm dismiss-keyguard || true
            sleep 20
            mkdir -p apps/mobile/build
            echo "== animator scales (for the record) =="
            adb shell settings get global window_animation_scale
            adb shell settings get global transition_animation_scale
            adb shell settings get global animator_duration_scale
            echo "== hermetic backend reachable from the emulator? =="
            adb shell "curl -s --max-time 5 http://10.0.2.2:4000/api/v1/health || echo EMULATOR-CURL-MISSING"
            echo "== Installing the x86_64 hermetic smoke APK =="
            adb install -r apps/mobile/build/Madarek-smoke-x86_64.apk
            echo "== Paint probes (native launch, no Maestro) =="
            adb logcat -c
            adb shell am start -n ly.madarek.mobile/.MainActivity
            sleep 8
            adb exec-out screencap -p > apps/mobile/build/paint-probe-8s.png
            sleep 17
            adb exec-out screencap -p > apps/mobile/build/paint-probe-25s.png
            adb shell uiautomator dump /sdcard/paint-dump.xml >/dev/null 2>&1
            adb pull /sdcard/paint-dump.xml apps/mobile/build/paint-probe-dump.xml >/dev/null 2>&1
            adb logcat -d > apps/mobile/build/logcat-paint-probe.log
            adb shell dumpsys activity top > apps/mobile/build/dumpsys-paint-probe.txt
            adb shell am force-stop ly.madarek.mobile
            echo "== Maestro alive-flow (login -> dashboard -> 60s alive), one flaky-infra retry =="
            maestro test apps/mobile/.maestro/smoke-alive.yaml --format junit --output apps/mobile/build/maestro-junit.xml || { echo "attempt 1 failed — capturing diagnostics"; adb exec-out screencap -p > apps/mobile/build/smoke-failure-attempt1.png; adb shell uiautomator dump /sdcard/wd1.xml >/dev/null 2>&1; adb pull /sdcard/wd1.xml apps/mobile/build/ui-attempt1.xml >/dev/null 2>&1; adb logcat -d > apps/mobile/build/logcat-failure.log; echo "attempt 1 diagnostics captured"; }
            { test -f apps/mobile/build/maestro-junit.xml && ! grep -q "<failure" apps/mobile/build/maestro-junit.xml; } || { echo "retrying once (flaky-infra allowance)"; maestro test apps/mobile/.maestro/smoke-alive.yaml --format junit --output apps/mobile/build/maestro-junit-retry.xml || { echo "retry failed too"; adb exec-out screencap -p > apps/mobile/build/smoke-failure-retry.png; }; }
            echo "== No-minify paint discriminator (only on double failure) =="
            { test -f apps/mobile/build/maestro-junit-retry.xml && grep -q "<failure" apps/mobile/build/maestro-junit-retry.xml; } && { echo "both attempts failed — probing the NO-MINIFY build"; adb uninstall ly.madarek.mobile || true; adb install -r apps/mobile/build/Madarek-smoke-x86_64-nominify.apk; adb logcat -c; adb shell am start -n ly.madarek.mobile/.MainActivity; sleep 12; adb exec-out screencap -p > apps/mobile/build/nominify-probe.png; adb shell uiautomator dump /sdcard/wd3.xml >/dev/null 2>&1; adb pull /sdcard/wd3.xml apps/mobile/build/ui-nominify.xml >/dev/null 2>&1; adb logcat -d > apps/mobile/build/logcat-nominify.log; adb shell am force-stop ly.madarek.mobile; } || echo "smoke finished — skipping the no-minify probe"
            echo "== Crash-buffer scan (fatal for ly.madarek.mobile) =="
            adb logcat -d -b crash | tee /tmp/crash-buffer.txt | grep -c "ly.madarek.mobile" | grep -qx 0
            echo "Alive-flow sequence complete."

      - name: Write the smoke result
        if: always()
        working-directory: apps/mobile
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p build
          RESULT="unknown"
          ATTEMPTS=0
          if [ -f build/maestro-junit.xml ] && ! grep -q '<failure' build/maestro-junit.xml; then
            RESULT="pass"; ATTEMPTS=1
          elif [ -f build/maestro-junit-retry.xml ] && ! grep -q '<failure' build/maestro-junit-retry.xml; then
            RESULT="pass-flaky"; ATTEMPTS=2
          elif [ -f build/maestro-junit.xml ] || [ -f build/maestro-junit-retry.xml ]; then
            RESULT="fail"; ATTEMPTS=$([ -f build/maestro-junit-retry.xml ] && echo 2 || echo 1)
          fi
          jq -n --arg result "$RESULT" --argjson attempts "$ATTEMPTS" \
            --arg api "hermetic (10.0.2.2:4000, same-commit backend)" \
            --arg run_url "$RUN_URL" \
            --arg commit "$(git rev-parse HEAD)" \
            '{smoke: $result, attempts: $attempts, api: $api, run_url: $run_url, commit: $commit}' \
            > build/smoke-result.json
          cat build/smoke-result.json
          if [ "$RESULT" = "fail" ] || [ "$RESULT" = "unknown" ]; then
            echo "::error::smoke result: $RESULT (recorded; publish proceeds on verify per R3 policy)"
            exit 1
          fi

      - name: Upload smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-result
          path: apps/mobile/build/smoke-result.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-diagnostics-${{ github.run_number }}
          path: |
            apps/mobile/build/maestro-junit.xml
            apps/mobile/build/maestro-junit-retry.xml
            apps/mobile/build/smoke-failure-attempt1.png
            apps/mobile/build/smoke-failure-retry.png
            apps/mobile/build/paint-probe-8s.png
            apps/mobile/build/paint-probe-25s.png
            apps/mobile/build/paint-probe-dump.xml
            apps/mobile/build/logcat-paint-probe.log
            apps/mobile/build/dumpsys-paint-probe.txt
            apps/mobile/build/ui-attempt1.xml
            apps/mobile/build/logcat-failure.log
            apps/mobile/build/nominify-probe.png
            apps/mobile/build/ui-nominify.xml
            apps/mobile/build/logcat-nominify.log
            apps/mobile/build/backend.log
            apps/mobile/build/gradle-smoke.log
          if-no-files-found: ignore
          retention-days: 14

  verify:
    name: Verify APK/AAB independently (Linux)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout verifier
        uses: actions/checkout@v4
        with:
          sparse-checkout: apps/mobile/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure the preinstalled Android SDK
        # The runner image already ships the SDK + cmdline-tools. Avoid
        # android-actions/setup-android v3 here: its license step hangs/fails
        # with the current cmdline-tools, and our next step accepts licenses
        # non-interactively before installing the exact packages we need.
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_ROOT" ]; then
            for candidate in "$HOME/Android/Sdk" /opt/android-sdk /usr/lib/android-sdk; do
              if [ -d "$candidate" ]; then SDK_ROOT="$candidate"; break; fi
            done
          fi
          test -d "$SDK_ROOT" || { echo "::error::Android SDK not found"; exit 1; }

          SDKMANAGER=""
          for dir in "$SDK_ROOT"/cmdline-tools/*/bin; do
            if [ -x "$dir/sdkmanager" ]; then SDKMANAGER="$dir/sdkmanager"; break; fi
          done
          test -n "$SDKMANAGER" || { echo "::error::sdkmanager not found under $SDK_ROOT"; exit 1; }

          SDKMANAGER_DIR=$(dirname "$SDKMANAGER")
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          export PATH="$SDKMANAGER_DIR:$SDK_ROOT/platform-tools:$PATH"
          command -v sdkmanager
          sdkmanager --version

      - name: Install build-tools for verification
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not set}"
          set +o pipefail
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          set -o pipefail
          sdkmanager --sdk_root="$ANDROID_HOME" --install "platform-tools" "build-tools;37.0.0"
          sdkmanager --sdk_root="$ANDROID_HOME" --list_installed | grep -E 'build-tools;37.0.0|platform-tools' || true

      - name: Download the APK/AAB candidate
        uses: actions/download-artifact@v4
        with:
          name: android-release-candidate
          path: candidate

      - name: Re-verify the downloaded artifacts
        env:
          BUILD_TOOLS_VERSION: "37.0.0"
        run: |
          set -euo pipefail
          SIGNING_MODE=$(jq -r .signing_mode candidate/build-info.json)
          python3 apps/mobile/scripts/verify-apk.py \
            --apk candidate/Madarek.apk \
            --aab candidate/Madarek.aab \
            --json-out candidate/verify-rerun.json \
            --expected-version "$(jq -r .version candidate/build-info.json)" \
            --expected-version-code "$(jq -r .version_code candidate/build-info.json)" \
            --min-sdk "$(jq -r .min_sdk candidate/build-info.json)" \
            --target-sdk "$(jq -r .target_sdk candidate/build-info.json)" \
            --expected-architectures "$(jq -r '.architectures | join(",")' candidate/build-info.json)" \
            --expected-signing-mode "$SIGNING_MODE" \
            --expected-runtime-version "$(jq -r .expected_runtime_version candidate/build-info.json)" \
            | tee candidate/verify.log

      - name: Cross-check metadata and publish the verified artifact
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          APK_SHA=$(sha256sum candidate/Madarek.apk | awk '{print $1}')
          APK_SIZE=$(stat -c%s candidate/Madarek.apk)
          AAB_SHA=$(sha256sum candidate/Madarek.aab | awk '{print $1}')
          AAB_SIZE=$(stat -c%s candidate/Madarek.aab)
          SIGNING_MODE=$(jq -r .signing_mode candidate/build-info.json)
          EXPECTED_CERT=$(jq -r .certificate_sha256 candidate/build-info.json)
          ACTUAL_CERT=$(jq -r .certificate_sha256 candidate/verify-rerun.json)
          test "$EXPECTED_CERT" = "$ACTUAL_CERT"

          BUILD_RUNTIME=$(jq -r '.runtime_version // empty' candidate/build-info.json)
          VERIFY_RUNTIME=$(jq -r '.runtime_version // empty' candidate/verify-rerun.json)
          EXPECTED_RUNTIME=$(jq -r '.expected_runtime_version // empty' candidate/build-info.json)
          test -n "$BUILD_RUNTIME"
          test -n "$EXPECTED_RUNTIME"
          test "$BUILD_RUNTIME" = "$VERIFY_RUNTIME"
          test "$EXPECTED_RUNTIME" = "$VERIFY_RUNTIME"

          BUILD_COMPILE_SDK=$(jq -r '.compile_sdk // empty' candidate/build-info.json)
          VERIFY_COMPILE_SDK=$(jq -r '.compile_sdk // empty' candidate/verify-rerun.json)
          test -n "$BUILD_COMPILE_SDK"
          test "$BUILD_COMPILE_SDK" = "$VERIFY_COMPILE_SDK"

          jq -e \
            --arg apk_sha "$APK_SHA" \
            --arg aab_sha "$AAB_SHA" \
            --argjson apk_size "$APK_SIZE" \
            --argjson aab_size "$AAB_SIZE" \
            --arg signing_mode "$SIGNING_MODE" \
            '.platform == "android" and .sha256 == $apk_sha and .size_bytes == $apk_size and .aab_sha256 == $aab_sha and .aab_size_bytes == $aab_size and .package == "ly.madarek.mobile" and .signing_mode == $signing_mode and (.runtime_version | test("^[0-9a-f]{40}$")) and .compile_sdk == 37 and .verified == false' \
            candidate/build-info.json >/dev/null

          mkdir -p verified
          cp candidate/Madarek.apk verified/Madarek.apk
          cp candidate/Madarek.aab verified/Madarek.aab
          cp candidate/verify-rerun.json verified/verify.json
          if [ -f candidate/mapping.txt ]; then cp candidate/mapping.txt verified/mapping.txt; fi
          jq -s \
            --arg verified_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg run_url "$RUN_URL" \
            --arg verifier "apps/mobile/scripts/verify-apk.py" \
            '.[0] * .[1] * {verified:true, verified_at:$verified_at, verify_run_url:$run_url, verifier:$verifier}' \
            candidate/build-info.json candidate/verify-rerun.json > verified/build-info.json
          (cd verified && sha256sum Madarek.apk Madarek.aab > SHA256SUMS.txt)

          echo "Verified APK SHA-256: $APK_SHA"
          echo "Verified AAB SHA-256: $AAB_SHA"
          cat verified/SHA256SUMS.txt

      - name: Upload the verified APK/AAB
        uses: actions/upload-artifact@v4
        with:
          name: Madarek-android-release
          path: |
            verified/Madarek.apk
            verified/Madarek.aab
            verified/SHA256SUMS.txt
            verified/build-info.json
            verified/verify.json
            verified/mapping.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Write verification summary
        run: |
          set -euo pipefail
          {
            echo "## Android APK/AAB verified"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Package | \`$(jq -r .package verified/build-info.json)\` |"
            echo "| Version | \`$(jq -r .version verified/build-info.json)\` (code \`$(jq -r .version_code verified/build-info.json)\`) |"
            echo "| Signing | \`$(jq -r .signing_mode verified/build-info.json)\` |"
            echo "| Certificate SHA-256 | \`$(jq -r .certificate_sha256 verified/build-info.json)\` |"
            echo "| APK SHA-256 | \`$(jq -r .sha256 verified/build-info.json)\` |"
            echo "| AAB SHA-256 | \`$(jq -r .aab_sha256 verified/build-info.json)\` |"
            echo "| ABIs | \`$(jq -r '.architectures|join(", ")' verified/build-info.json)\` |"
            echo "| Compile SDK | \`$(jq -r .compile_sdk verified/build-info.json)\` |"
            echo "| OTA runtime version | \`$(jq -r .runtime_version verified/build-info.json)\` |"
            echo "| OTA channel | \`$(jq -r .updates_channel verified/build-info.json)\` |"
            echo "| Verified | $(jq -r .verified_at verified/build-info.json) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-verify-diagnostics-${{ github.run_number }}
          path: |
            candidate/verify.log
            candidate/verify-rerun.json
            candidate/build-info.json
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish rolling Android release
    needs: [verify, smoke]
    # R3 publish policy: the release is replaced whenever build + the
    # INDEPENDENT verify pass. The smoke result is merged into
    # build-info.json (smoke: pass|fail|pass-flaky|unknown) and shown in
    # the summary; a failed smoke makes the RUN red (loud) but never
    # leaves the public APK stale for days — the owner's headline
    # requirement is "always the newest APK". schedule (nightly net)
    # publishes exactly like a push on main.
    if: >-
      always() &&
      needs.verify.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event.inputs.ref == 'main' || github.event.inputs.ref == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download the verified APK/AAB
        uses: actions/download-artifact@v4
        with:
          name: Madarek-android-release
          path: verified

      - name: Download the smoke result (if produced)
        uses: actions/download-artifact@v4
        with:
          name: android-smoke-result
          path: smoke
        continue-on-error: true

      - name: Merge the smoke result into build-info
        run: |
          set -euo pipefail
          if [ -f smoke/smoke-result.json ]; then
            SMOKE=$(jq -r .smoke smoke/smoke-result.json)
            SMOKE_URL=$(jq -r .run_url smoke/smoke-result.json)
            SMOKE_API=$(jq -r .api smoke/smoke-result.json)
            SMOKE_ATTEMPTS=$(jq -r .attempts smoke/smoke-result.json)
          else
            SMOKE="unknown"; SMOKE_URL=""; SMOKE_API="not run"; SMOKE_ATTEMPTS=0
          fi
          echo "smoke: $SMOKE (attempts: $SMOKE_ATTEMPTS, api: $SMOKE_API)"
          jq --arg smoke "$SMOKE" \
             --arg smoke_url "$SMOKE_URL" \
             --arg smoke_api "$SMOKE_API" \
             --argjson smoke_attempts "$SMOKE_ATTEMPTS" \
             '. * {smoke: $smoke, smoke_run_url: $smoke_url, smoke_api: $smoke_api, smoke_attempts: $smoke_attempts}' \
             verified/build-info.json > verified/build-info.tmp.json
          mv verified/build-info.tmp.json verified/build-info.json
          jq -r '.smoke' verified/build-info.json

      - name: Render release notes
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/ci/render-mobile-release-notes.py \
            --platform android \
            --build-info verified/build-info.json \
            --repo "$GITHUB_REPOSITORY" \
            --tag android-latest \
            --run-url "$RUN_URL" > release-notes.md
          SMOKE=$(jq -r .smoke verified/build-info.json)
          SMOKE_URL=$(jq -r '.smoke_run_url // ""' verified/build-info.json)
          case "$SMOKE" in
            pass) BADGE="✅ emulator smoke: PASS (hermetic backend)" ;;
            pass-flaky) BADGE="✅ emulator smoke: PASS on retry (flaky infra noted)" ;;
            fail) BADGE="⚠️ emulator smoke: FAIL — $SMOKE_URL" ;;
            *) BADGE="⚠️ emulator smoke: not run/unknown" ;;
          esac
          printf '\n---\n\n%s\n' "$BADGE" >> release-notes.md
          cat release-notes.md

      - name: Publish/update android-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          COMMIT=$(jq -r .commit verified/build-info.json)
          bash scripts/ci/publish-rolling-release.sh \
            android-latest \
            "Madarek.apk — latest Android release build" \
            release-notes.md \
            "$COMMIT" \
            verified/Madarek.apk \
            verified/Madarek.aab \
            verified/SHA256SUMS.txt \
            verified/build-info.json \
            verified/verify.json

      - name: Write release summary
        run: |
          set -euo pipefail
          SMOKE=$(jq -r .smoke verified/build-info.json)
          SMOKE_URL=$(jq -r '.smoke_run_url // ""' verified/build-info.json)
          {
            echo "## Android release updated"
            echo
            echo "**Installable APK:** https://github.com/$GITHUB_REPOSITORY/releases/download/android-latest/Madarek.apk"
            echo
            echo "**Play upload AAB:** https://github.com/$GITHUB_REPOSITORY/releases/download/android-latest/Madarek.aab"
            echo
            echo "**Signing:** \`$(jq -r '.signing_mode' verified/build-info.json)\`"
            echo
            echo "**SHA-256:** \`$(jq -r '.sha256' verified/build-info.json)\`"
            echo
            echo "**Commit:** \`$(jq -r '.commit' verified/build-info.json)\`"
            echo
            echo "**Emulator smoke (hermetic):** $SMOKE — $SMOKE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
