name: Config Pages mirror

# R351 X3 — mirror /config/app.json to GitHub Pages: the remote config
# must live on an ALWAYS-UP static origin that is NOT the API (the
# Vercel deployment is the other one). The workflow force-pushes the
# config directory to the gh-pages branch whenever it changes on main;
# GitHub Pages serves it at
# https://ahmadmedo1012.github.io/madarek/config/app.json
on:
  push:
    branches: [main]
    paths:
      - 'frontend/public/config/**'
      - '.github/workflows/config-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  mirror:
    name: Publish config/ to gh-pages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout main (config only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            frontend/public/config
      - name: Publish to gh-pages (config/ only — never the whole repo)
        run: |
          set -euo pipefail
          # Plumbing, not a working-tree switch: build a root tree that
          # contains ONLY config/app.json (no history, no source, nothing
          # else from the repo ever reaches Pages) and force-push it.
          BLOB=$(git hash-object -w frontend/public/config/app.json)
          SUBTREE=$(printf '100644 blob %s\tapp.json\n' "$BLOB" | git mktree)
          ROOT=$(printf '040000 tree %s\tconfig\n' "$SUBTREE" | git mktree)
          COMMIT=$(git commit-tree "$ROOT" -m "config: mirror frontend/public/config from main@${GITHUB_SHA::8}")
          git push origin "$COMMIT:refs/heads/gh-pages" --force
