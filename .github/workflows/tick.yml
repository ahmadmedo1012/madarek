# R351 X2b — the serverless tick (*/5 best-effort).
#
# DORMANT BY DESIGN: the job skips silently until the repo variable
# TICK_TARGET_URL is set (the X4 cutover flips it to the Vercel
# production URL). Before that, the API lives on Render where the
# in-process scheduler already ticks — pointing this workflow at Render
# would keep the free instance awake 24/7 and defeat X0's hours budget.
#
# GitHub schedules are best-effort and starved on quiet repos (measured
# ~4 runs/day at */5 — R350 H3), so this is ONE trigger of four, never
# the only one: Vercel's daily secure cron (vercel.json), the
# opportunistic tick riding traffic (api/index.mjs), and the
# post-enqueue drain (mail-outbox.ts) all keep the platform correct;
# this workflow only tightens mail latency between visits.
name: Tick

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    name: POST /api/v1/internal/tick
    # Empty/absent TICK_TARGET_URL = dormant (pre-cutover).
    if: ${{ vars.TICK_TARGET_URL != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Tick the API (CRON_SECRET-guarded, retry-aware)
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            CODE=$(curl -sS -X POST --max-time 120 \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -H 'Content-Type: application/json' \
              -o tick-response.json -w '%{http_code}' \
              "${{ vars.TICK_TARGET_URL }}/api/v1/internal/tick" || echo 000)
            echo "attempt $attempt → HTTP $CODE"
            cat tick-response.json || true
            echo
            case "$CODE" in
              200) exit 0 ;;
              000|502|503|504) sleep $((attempt * 10)) ;;  # waking/transport — retry
              *) exit 1 ;;
            esac
          done
          echo "::error::tick did not answer 200 after 3 attempts"
          exit 1

      # r357 L5 — issue-on-all-providers-down: /status's ai block
      # carries the cross-instance verdict (allProvidersDownSince, ISO
      # or null — telemetry-backed, see lib/ai/provider-health.ts).
      # When every provider has been down > 5 min, open ONE GitHub
      # issue (deduped by the ai-providers-down label + open state).
      - name: Open an issue if every AI provider is down
        if: ${{ vars.TICK_TARGET_URL != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DOWN_SINCE=$(curl -sS --max-time 30 "${{ vars.TICK_TARGET_URL }}/api/v1/status" \
            | jq -r '.data.ai.allProvidersDownSince // empty' 2>/dev/null || true)
          if [ -z "$DOWN_SINCE" ]; then
            echo "AI providers healthy (or verdict unreadable) — no issue"
            exit 0
          fi
          if gh issue list --repo "$GITHUB_REPOSITORY" --label ai-providers-down --state open --json number --jq 'length' | grep -qv '^0$'; then
            echo "an ai-providers-down issue is already open — not duplicating"
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "كل مزوّدي الذكاء الاصطناعي متوقفون (منذ $DOWN_SINCE)" \
            --body "أرسلت \`/status\`_verdict: allProvidersDownSince=$DOWN_SINCE\`. راجع حدود الاستخدام المجانية (Gemini/Groq) في \`docs/HOSTING.md\`. يُغلق هذا الإصدار تلقائيًا عندما يتعافى المزوّدون." \
            --label ai-providers-down || true
