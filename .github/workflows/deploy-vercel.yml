# R351 X4 → R353 repair — the production deploy verification workflow.
#
# REALITY (verified 2026-11-15): the Vercel GitHub integration deploys
# every push to main AUTOMATICALLY (one READY production deployment per
# sha — including shas where this workflow failed before ever reaching
# a deploy step; e.g. 0ddf853 went READY while this workflow's pin step
# 404'd). The buildId is baked at BUILD time by
# backend/scripts/bake-build-sha.mjs from VERCEL_GIT_COMMIT_SHA (a
# git-integration build env), so no per-deploy env pinning is needed —
# the old "Pin the build id (RENDER_GIT_COMMIT)" step PATCHes a project
# env that was DELIBERATELY deleted in the R353 buildId saga and 404s.
#
# Flow now: push → CI + the git-integration deploy run in parallel;
# this workflow WAITS for CI green, then waits until the LIVE
# production build is THIS sha's deployment (buildId == sha via
# /api/v1/health), then runs the full browser-level live smoke.
# No CLI deploy — a second deployment of the same sha would compete
# with the integration's build for the Hobby plan's single builder
# (the R352 double-deploy cancellation lesson).
#
# PRs: the verify job runs (CI must be green); the deploy job is
# main-only — the integration's preview deployment needs no help.
#
# Secrets (repo): GITHUB_TOKEN (built-in) — VERCEL_* no longer needed
# by this workflow.
name: Deploy Vercel

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'shared/**'
      - 'api/**'
      - 'vercel.json'
      - '.vercelignore'
      - '.github/workflows/deploy-vercel.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'shared/**'
      - 'api/**'
      - 'vercel.json'
      - '.vercelignore'
      - '.github/workflows/deploy-vercel.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gates: CI (the full matrix) must be green on the SAME sha —
  # R357 L1: SUPERSEDE-AWARE. The old inline loop read a cancelled CI
  # run (cancelled by a newer main push's per-ref concurrency — a
  # docs-only push counts) as "concluded without success" and turned
  # this workflow red on healthy shas (c83f6d67, 600c943a, aa7cb126).
  # The law now: a cancelled run is not a conclusion; a sha superseded
  # on main exits green with a notice; otherwise the latest
  # non-cancelled CI run decides. Logic + tests + dry-run fixtures:
  # scripts/qa/await-ci.mjs and scripts/qa/fixtures/await-ci/.
  verify:
    name: CI green on this sha
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for the CI workflow conclusion (supersede-aware)
        run: |
          set -euo pipefail
          node scripts/qa/await-ci.mjs \
            --repo "${{ github.repository }}" \
            --sha "${{ github.sha }}" \
            --event "${{ github.event_name }}" \
            --ref "${{ github.ref }}" \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            --max-minutes 28 --poll-seconds 20

  deploy:
    name: await the git-integration deploy + live smoke
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait until the live production build IS this sha
        # The git integration builds every main push; the bake pins the
        # deployment sha into /api/v1/health's buildId. Poll until they
        # match — proof that THIS push's deployment is the one serving
        # (not a stale lambda, not a previous sha).
        # R357 L1: SUPERSEDE-TOLERANT. Stacked pushes can race this
        # sha's deployment out of the live slot; the step also accepts
        # the CURRENT main tip's buildId (main only moves forward, so
        # that deployment contains this push as an ancestor). Either
        # way the smoke below proves the LIVE production build.
        run: |
          set -euo pipefail
          URL="https://madarek-app.vercel.app"
          WANT="${{ github.sha }}"
          SHORT="${WANT:0:12}"
          for attempt in $(seq 1 60); do
            MAIN=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/commits/main" \
              | jq -r '.sha // empty' 2>/dev/null | cut -c1-12 || true)
            BODY=$(curl -s --max-time 20 "$URL/api/v1/health" || echo '{}')
            GOT=$(echo "$BODY" | jq -r '.buildId // ""')
            OK=$(echo "$BODY" | jq -r '.ok // false')
            echo "attempt $attempt → buildId=$GOT ok=$OK (want $SHORT, main tip $MAIN)"
            if [ "$OK" = "true" ]; then
              if [ "$GOT" = "$SHORT" ]; then
            echo "the ${SHORT} deployment is LIVE and healthy"
            exit 0
              fi
              if [ -n "$MAIN" ] && [ "$GOT" = "$MAIN" ]; then
            echo "superseded-tolerant: live buildId=$GOT is the newer main tip — this push rides main history; smoking it"
            exit 0
              fi
            fi
            sleep 15
          done
          echo "::error::neither ${SHORT} nor the current main tip became the live production build"
          exit 1

      - name: Live smoke on the production URL
        run: |
          set -euo pipefail
          URL="https://madarek-app.vercel.app"
          # Wake-tolerant: 502/503 = still deploying, keep trying.
          for attempt in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL/api/v1/health" || echo 000)
            echo "health attempt $attempt → HTTP $CODE"
            [ "$CODE" = "200" ] && break
            sleep 10
          done
          [ "$CODE" = "200" ] || { echo "::error::health never answered 200"; exit 1; }
          # The full browser-level live smoke (R350 H6 instrument).
          cd frontend && npm ci --no-audit --no-fund >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1 || npx playwright install chromium-headless-shell >/dev/null 2>&1 || true
          cd .. && node scripts/qa/live-smoke.mjs "$URL"
