# R351 X4 — the Vercel production deploy, from CI, after the gates.
#
# Flow: push/PR → CI (ci.yml) + this workflow's verify job run in
# parallel; the deploy job needs CI green (the R350 R3 verify-gated
# publish policy, ported to the web API), then pins the deployed
# buildId, `vercel deploy --prod` (a REMOTE build — the platform runs
# vercel.json's buildCommand with the project's stored env, the 5
# sensitive values included), and the retry-aware live smoke against
# the deployed URL.
#
# PRs: the same job tree but `vercel deploy` without --prod (preview
# deployments; preview env is the isolated spike database — never prod
# data).
#
# Secrets (repo): VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# The dormant ticker (tick.yml) wakes at the cutover via the
# TICK_TARGET_URL repo variable.
name: Deploy Vercel

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'shared/**'
      - 'api/**'
      - 'vercel.json'
      - '.vercelignore'
      - '.github/workflows/deploy-vercel.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'shared/**'
      - 'api/**'
      - 'vercel.json'
      - '.vercelignore'
      - '.github/workflows/deploy-vercel.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gates: CI (the full matrix) must be green on the SAME sha.
  verify:
    name: CI green on this sha
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Wait for the CI workflow conclusion
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            STATUS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=20" \
              | jq -r '[.workflow_runs[] | select(.name == "CI")] | sort_by(.created_at) | last | "\(.status) \(.conclusion // "-")"')
            echo "CI: $STATUS (attempt $attempt)"
            case "$STATUS" in
              completed\ success) exit 0 ;;
              completed\ *) echo "::error::CI concluded without success: $STATUS"; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::CI did not conclude within the wait window"
          exit 1

  deploy:
    name: vercel deploy (prod on main, preview on PRs)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pin the build id (RENDER_GIT_COMMIT = this sha)
        # CLI deploys inject no git-sha env (that's a git-integration
        # feature), so the workflow pins it per deploy: PATCH the
        # project's RENDER_GIT_COMMIT to this sha before the
        # pull/build/deploy, and /api/v1/status serves it as buildId —
        # deploy-smoke's wait-for-deploy then matches buildId == the
        # pushed sha, proving THIS deploy is the one serving.
        run: |
          set -euo pipefail
          ENV_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            "https://api.vercel.com/v9/projects/${{ secrets.VERCEL_PROJECT_ID }}/env?teamId=${{ secrets.VERCEL_ORG_ID }}" \
            | jq -r '[.envs[] | select(.key == "RENDER_GIT_COMMIT")][0].id')
          echo "RENDER_GIT_COMMIT env id: $ENV_ID"
          CODE=$(curl -s -X PATCH \
            "https://api.vercel.com/v10/projects/${{ secrets.VERCEL_PROJECT_ID }}/env/$ENV_ID?teamId=${{ secrets.VERCEL_ORG_ID }}" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H 'Content-Type: application/json' \
            -d '{"value":"${{ github.sha }}","type":"encrypted","target":["production","preview"]}' \
            -o /dev/null -w '%{http_code}')
          echo "pin buildId -> HTTP $CODE"
          [ "$CODE" = "200" ]

      - name: Deploy (remote build — the platform runs the buildCommand with the REAL env)
        # `vercel deploy --prod` builds on Vercel's own infra: the project's
        # stored env values (the 5 pull-protected sensitive ones included)
        # are injected server-side. The --prebuilt path embedded the
        # "[SENSITIVE]" placeholders `vercel pull` writes for those values
        # and the functions then failed at runtime (run 43595196731, the
        # first --prebuilt prod deploy: DB_UNAVAILABLE in 12 ms — an invalid
        # connection string, not a slow DB; the X1/X2 spike deployments on
        # this remote path verified green end to end). No local npm ci and
        # no vercel build: the platform runs vercel.json's buildCommand
        # itself against the uploaded source.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            vercel deploy --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} --project=${{ secrets.VERCEL_PROJECT_ID }}
          else
            vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} --project=${{ secrets.VERCEL_PROJECT_ID }}
          fi

      - name: Live smoke on the production URL (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          URL="https://madarek-nine.vercel.app"
          # Wake-tolerant: 502/503 = still deploying, keep trying.
          for attempt in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL/api/v1/health" || echo 000)
            echo "health attempt $attempt → HTTP $CODE"
            [ "$CODE" = "200" ] && break
            sleep 10
          done
          [ "$CODE" = "200" ] || { echo "::error::health never answered 200"; exit 1; }
          # The full browser-level live smoke (R350 H6 instrument).
          cd frontend && npm ci --no-audit --no-fund >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1 || npx playwright install chromium-headless-shell >/dev/null 2>&1 || true
          cd .. && node scripts/qa/live-smoke.mjs "$URL"
