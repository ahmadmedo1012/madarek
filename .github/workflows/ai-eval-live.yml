# R355 C — the LIVE per-provider golden table (direct provider calls).
#
# The sandbox (and any single machine) is geo-blocked away from Groq
# (edge 403) and sometimes Gemini — so the per-provider accuracy/
# latency evidence for routing decisions is collected HERE, on a
# GitHub runner, with the repo secrets GEMINI_API_KEY + GROQ_API_KEY
# (owner-added). Companion of ai-selftest.yml (which probes through
# the production function); this one fires the frozen 54-case
# live-only golden set at each provider arm DIRECTLY:
#   · gemini / gemini-2.5-flash
#   · groq / openai/gpt-oss-20b  (the fast lane)
#   · groq / openai/gpt-oss-120b (the larger reasoning arm)
# Owner-only by construction (workflow_dispatch needs write access).
name: AI eval live (per-provider golden table)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ai-eval-live
  cancel-in-progress: false

jobs:
  eval:
    name: Fire the 54-case golden set at each provider arm
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Run the per-provider eval
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -uo pipefail
          node scripts/qa/ai-eval-providers.mjs eval-report.json | tee eval-table.txt
          # Unanswered turns (rate limit / quota) are honest evidence —
          # recorded, never fatal. A total block (exit 2) IS fatal.
          rc=${PIPESTATUS[0]}
          if [ "$rc" -eq 2 ]; then
            echo "::error::eval BLOCKED — no provider credentials reached the runner"
            exit 1
          fi
          echo "eval finished (rc=$rc — 0 all answered, 1 some unanswered)"

      - name: Table → step summary
        if: always()
        run: cat eval-table.txt >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload the raw report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-providers-report
          path: |
            eval-report.json
            eval-table.txt
          if-no-files-found: ignore
          retention-days: 30
