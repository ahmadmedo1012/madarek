# R357-UI — A5: real screenshots of the mobile shell, from the CI emulator.
#
# WHY this exists: the mobile UI is the one surface nobody could look at.
# The author's machine cannot run an emulator, unit tests cannot see
# layout, and the release smoke only proves "the app is alive" — never
# what it looks like. This workflow is MANUAL (workflow_dispatch), builds
# a throwaway APK from current/main source, runs against runner-local
# Postgres and API, and walks each selected role shell with Maestro.
#
# Deliberately NOT a gate: it never blocks a PR or publishes a release.
name: UI screens (emulator, manual)

on:
  workflow_dispatch:
    inputs:
      role:
        description: "Role to capture (all by default)"
        type: choice
        options: [all, student, teacher, registrar, quality, owner]
        required: true
        default: all
      app_ref:
        description: "App source for this capture set"
        type: choice
        options: [current, main]
        required: true
        default: current
      profile_set:
        description: "Device profiles: core (4: light/dark × standard/small) or extended (tablet 800×1280, landscape phone, font-scale 2.0, dark tablet)"
        type: choice
        options: [core, extended]
        required: true
        default: core

permissions:
  contents: read
  actions: read

concurrency:
  group: ui-screens-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview-apk:
    name: Build branch preview APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:4000/api/v1
      EXPO_PUBLIC_DISABLE_REMOTE_CONFIG: "1"
      # R362 — the media-origin override: the hermetic backend serves the
      # API but not the web's static /media tree (serveStatic is
      # prod-gated; forcing prod breaks HTTP cookies on the emulator), so
      # every prior capture's hero band rendered as empty reserved space
      # (the R358 "startup messages" finding). The screens job mounts a
      # static fixture for frontend/public on :4100; the app reads this
      # origin for illustrations (unset in retail builds — no product
      # behavior change).
      EXPO_PUBLIC_MEDIA_ORIGIN: http://10.0.2.2:4100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.app_ref == 'main' && 'main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"
      - name: Install mobile dependencies and generate Android project
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx expo prebuild --platform android --no-install
          sed -i 's|<application |<application android:usesCleartextTraffic="true" |' android/app/src/main/AndroidManifest.xml
          if grep -q '^reactNativeArchitectures=' android/gradle.properties; then
            sed -i 's|^reactNativeArchitectures=.*|reactNativeArchitectures=x86_64|' android/gradle.properties
          else
            echo 'reactNativeArchitectures=x86_64' >> android/gradle.properties
          fi
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
      - name: Build branch APK against local backend
        working-directory: apps/mobile
        env:
          MADAREK_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          (cd android && ./gradlew :app:assembleRelease --no-daemon)
          mkdir -p build/screens-apk
          cp android/app/build/outputs/apk/release/app-release.apk build/screens-apk/Madarek-x86_64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ui-screens-preview-apk-${{ github.run_id }}
          path: apps/mobile/build/screens-apk/Madarek-x86_64.apk
          retention-days: 3

  screens:
    name: "Capture ${{ matrix.role }} — ${{ matrix.profile.id }}"
    if: inputs.profile_set != 'extended'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        role: ${{ fromJSON(inputs.role == 'all' && '["student","teacher","registrar","quality","owner"]' || format('["{0}"]', inputs.role)) }}
        profile:
          - { id: light-standard, theme: light, theme_label: "فاتح", font_scale: '1.0', viewport: standard }
          - { id: dark-standard, theme: dark, theme_label: "داكن", font_scale: '1.0', viewport: standard }
          - { id: light-a11y-small, theme: light, theme_label: "فاتح", font_scale: '1.3', viewport: small-360x640 }
          - { id: dark-a11y-small, theme: dark, theme_label: "داكن", font_scale: '1.3', viewport: small-360x640 }
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: preview-apk
    # R358 A1: NO `disable-animations: true` here. It zeroes
    # animator_duration_scale after boot, and on RN 0.88 + Reanimated 4
    # an entering animation at scale 0 never reaches its final state —
    # every `entering` view (welcome title, CTA, role tabs) stays
    # invisible forever. That blank shell is exactly why run
    # 43898742777's student captures failed at the first assertion.
    # Boot speed is preserved by -no-boot-anim; the capture must see the
    # app exactly as users do (the script below re-asserts the scales).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: madarek
          POSTGRES_PASSWORD: madarek
          POSTGRES_DB: madarek_screens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U madarek"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://madarek:madarek@localhost:5432/madarek_screens
      JWT_ACCESS_SECRET: ci-only-access-secret-0123456789abcdef0123456789abcdef
      JWT_REFRESH_SECRET: ci-only-refresh-secret-0123456789abcdef0123456789abcd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-screens-preview-apk-${{ github.run_id }}
          path: ${{ runner.temp }}/apk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start hermetic backend for screenshots
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build -w backend
          npm run db:deploy
          npm run db:seed
          DATABASE_URL="$DATABASE_URL" JWT_ACCESS_SECRET="$JWT_ACCESS_SECRET" JWT_REFRESH_SECRET="$JWT_REFRESH_SECRET" PORT=4000 MADAREK_TEST_ACCOUNTS=1 nohup node backend/dist/server.js > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:4000/api/v1/health | grep -q '"ok":true' && exit 0
            sleep 2
          done
          tail -50 "$RUNNER_TEMP/backend.log"
          exit 1

      # R362 — the /media fixture: the app's illustrations (hero bands,
      # empty-state rooms) load from the WEB origin, which the hermetic
      # backend cannot serve (see the preview-apk note). frontend/public
      # holds the byte-synced illustration twins the retail web serves —
      # mounting them on :4100 completes the capture environment so the
      # screenshots finally show the art instead of reserved space.
      # python3's http.server needs no extra dependencies and guesses
      # webp content types correctly on 24.04.
      - name: Serve the web /media tree for illustrations
        run: |
          set -euo pipefail
          test -d frontend/public/media
          (cd frontend/public && nohup python3 -m http.server 4100 --bind 127.0.0.1 > "$RUNNER_TEMP/media.log" 2>&1 &)
          for i in $(seq 1 15); do
            curl -fsS -o /dev/null http://127.0.0.1:4100/media/manifest.json && break
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:4100/media/manifest.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: KVM for the emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Walk the selected role and capture every tab
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          # R362 — the headroom the release smoke already runs with
          # (build-android.yml): the a11y-small profiles (360x640 +
          # density 160 + font-scale 1.3) ANR'd the system launcher on
          # 3 of 20 run-19 jobs under the default 2-core/2GB emulator —
          # the system «Close app / Wait» sheet then covered the app
          # while it rendered fine behind it (hide_error_dialogs hid the
          # symptom; this treats the cause).
          cores: 3
          ram-size: 3072M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          pre-emulator-launch-script: |
            # R366 A5 — LANDSCAPE PANEL FIX (one line, line-safe): `wm size 2340x1080`
            # post-boot is silently ignored on the portrait-native AVD (runs 29/35
            # "landscape" shots measured 1080x2340 PORTRAIT — pixel-verified), so the
            # panel itself is landscape before first boot. Portrait-shaped overrides
            # (800x1280, 360x640) DO work post-boot and keep the wm path below.
            printf 'hw.lcd.width=%s\nhw.lcd.height=%s\nhw.lcd.density=420\n' "$([ '${{ matrix.profile.viewport }}' = landscape-2340x1080 ] && echo 2340 || echo 1080)" "$([ '${{ matrix.profile.viewport }}' = landscape-2340x1080 ] && echo 1080 || echo 2340)" >> "$ANDROID_AVD_HOME/test.avd/config.ini"
          script: |
            # android-emulator-runner executes this field with /bin/sh.
            # Keep the script POSIX so every role/profile can start.
            set -eu
            mkdir -p apps/mobile/build
            adb wait-for-device
            adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done'
            adb shell wm dismiss-keyguard || true
            # Re-assert the system animation scales explicitly: the app's
            # motion pipeline (Reanimated 4 entering animations) must run
            # for its content to become visible at all. See the job-level
            # note above; -no-boot-anim keeps the boot itself fast.
            adb shell settings put global window_animation_scale 1.0
            adb shell settings put global transition_animation_scale 1.0
            adb shell settings put global animator_duration_scale 1.0
            # R362 — ASSERT the scales, don't just set them: a zero scale
            # (the old disable-animations class) freezes every entering
            # animation at opacity 0 and the capture dies at the first
            # assertion with a blank shell — the run-43898742777 failure
            # mode. Failing LOUDLY here names the actual cause instead of
            # a 120s welcome-title timeout three steps later.
            # ONE LINE: the runner executes this field line-by-line (sh -c
            # per line) — multi-line for/if blocks are a syntax error there.
            # The assert loop runs INSIDE the device shell (single quotes);
            # adb propagates the non-zero exit to the step.
            adb shell 'for s in window_animation_scale transition_animation_scale animator_duration_scale; do v=$(settings get global $s); if [ "$v" != "1.0" ]; then echo "FAIL: $s=$v (expected 1.0)"; exit 1; fi; done'
            # Run 19: the 360x640 + density + font-scale changes ANR'd the
            # system launcher on 3 of 20 jobs, and the system «Close app /
            # Wait» sheet covered the app while it rendered fine behind
            # it. Hide the system error sheets for the capture (standard
            # emulator CI practice).
            adb shell settings put global hide_error_dialogs 1
            adb shell settings put system font_scale '${{ matrix.profile.font_scale }}'
            test '${{ matrix.profile.viewport }}' != small-360x640 || adb shell wm size 360x640
            test '${{ matrix.profile.viewport }}' != small-360x640 || adb shell wm density 160
            test '${{ matrix.profile.viewport }}' != tablet-800x1280 || adb shell wm size 800x1280
            test '${{ matrix.profile.viewport }}' != tablet-800x1280 || adb shell wm density 160
            test '${{ matrix.profile.viewport }}' != landscape-2340x1080 || adb shell wm size 2340x1080
            sleep 4
            adb shell wm dismiss-keyguard || true
            adb install -r '${{ runner.temp }}/apk/Madarek-x86_64.apk'
            adb shell am start -n ly.madarek.mobile/.MainActivity
            sleep 20
            mkdir -p apps/mobile/build/screens
            adb exec-out screencap -p > apps/mobile/build/screens/launch-20s.png
            adb logcat -d > apps/mobile/build/screens/logcat-before-maestro.log
            printf 'role=%s\ntheme=%s\nfont_scale=%s\nviewport=%s\n' '${{ matrix.role }}' '${{ matrix.profile.theme }}' '${{ matrix.profile.font_scale }}' '${{ matrix.profile.viewport }}' > apps/mobile/build/screens/profile.txt
            # the flow writes into the CWD; keep it inside the workspace so
            # the upload step can find the shots. R362 — ONE retry on the
            # documented flake class (GitHub's emulator/API startup hiccups
            # still killed branch-tip runs): the flows run clearState, so a
            # retry starts from the same deterministic welcome-sheet state.
            # A second consecutive failure is a real red and stays red.
            adb shell dumpsys gfxinfo ly.madarek.mobile reset > /dev/null 2>&1 || true
            # ONE LINE (line-by-line runner): attempt 1 || one clean retry —
            # clearState makes the retry deterministic; a second failure is
            # a real red and stays red (the || group's exit code is the
            # retry's).
            maestro test "apps/mobile/.maestro/screens-${{ matrix.role }}.yaml" -e THEME_LABEL="${{ matrix.profile.theme_label }}" -e THEME_ID="${{ matrix.profile.theme }}" --test-output-dir apps/mobile/build/screens || { echo "::warning::maestro attempt 1 failed — one retry from clean app state"; adb shell am force-stop ly.madarek.mobile || true; sleep 3; maestro test "apps/mobile/.maestro/screens-${{ matrix.role }}.yaml" -e THEME_LABEL="${{ matrix.profile.theme_label }}" -e THEME_ID="${{ matrix.profile.theme }}" --test-output-dir apps/mobile/build/screens; }
            adb exec-out screencap -p > apps/mobile/build/screens/last-frame.png
            adb logcat -d > apps/mobile/build/screens/logcat-after-maestro.log
            adb shell dumpsys gfxinfo ly.madarek.mobile > apps/mobile/build/screens/gfxinfo.txt 2>&1 || true
            ls -l apps/mobile/build/screens || true

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screens-${{ github.run_number }}-${{ matrix.role }}-${{ matrix.profile.id }}
          path: apps/mobile/build/screens
          if-no-files-found: warn
          retention-days: 14

  # R366 A5 — the EXTENDED device-shape matrix: tablet 800×1280 (sw≥600dp,
  # the rail + content-column tier), landscape phone (2340×1080 @420 ≈
  # 890×411dp), font-scale 2.0 (the a11y ceiling — no truncated primary
  # actions), and dark tablet. Same job body as `screens`; only the matrix
  # and the `if` differ (kept as a twin job because a workflow_dispatch
  # input cannot conditionally reshape a static matrix cleanly).
  screens-extended:
    name: "Capture-extended ${{ matrix.role }} — ${{ matrix.profile.id }}"
    if: inputs.profile_set == 'extended'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        role: ${{ fromJSON(inputs.role == 'all' && '["student","teacher","registrar","quality","owner"]' || format('["{0}"]', inputs.role)) }}
        profile:
          - { id: light-tablet-800x1280, theme: light, theme_label: "فاتح", font_scale: '1.0', viewport: tablet-800x1280 }
          - { id: dark-tablet-800x1280, theme: dark, theme_label: "داكن", font_scale: '1.0', viewport: tablet-800x1280 }
          - { id: light-landscape-2340x1080, theme: light, theme_label: "فاتح", font_scale: '1.0', viewport: landscape-2340x1080 }
          - { id: light-fs2, theme: light, theme_label: "فاتح", font_scale: '2.0', viewport: standard }
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: preview-apk
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: madarek
          POSTGRES_PASSWORD: madarek
          POSTGRES_DB: madarek_screens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U madarek"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://madarek:madarek@localhost:5432/madarek_screens
      JWT_ACCESS_SECRET: ci-only-access-secret-0123456789abcdef0123456789abcdef
      JWT_REFRESH_SECRET: ci-only-refresh-secret-0123456789abcdef0123456789abcd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-screens-preview-apk-${{ github.run_id }}
          path: ${{ runner.temp }}/apk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start hermetic backend for screenshots
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build -w backend
          npm run db:deploy
          npm run db:seed
          DATABASE_URL="$DATABASE_URL" JWT_ACCESS_SECRET="$JWT_ACCESS_SECRET" JWT_REFRESH_SECRET="$JWT_REFRESH_SECRET" PORT=4000 MADAREK_TEST_ACCOUNTS=1 nohup node backend/dist/server.js > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:4000/api/v1/health | grep -q '"ok":true' && exit 0
            sleep 2
          done
          tail -50 "$RUNNER_TEMP/backend.log"
          exit 1
      - name: Serve the web /media tree for illustrations
        run: |
          set -euo pipefail
          test -d frontend/public/media
          (cd frontend/public && nohup python3 -m http.server 4100 --bind 127.0.0.1 > "$RUNNER_TEMP/media.log" 2>&1 &)
          for i in $(seq 1 15); do
            curl -fsS -o /dev/null http://127.0.0.1:4100/media/manifest.json && break
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:4100/media/manifest.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version
      - name: KVM for the emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Walk the selected role and capture every tab
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          cores: 3
          ram-size: 3072M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          pre-emulator-launch-script: |
            # R366 A5 — LANDSCAPE PANEL FIX (one line, line-safe): `wm size 2340x1080`
            # post-boot is silently ignored on the portrait-native AVD (runs 29/35
            # "landscape" shots measured 1080x2340 PORTRAIT — pixel-verified), so the
            # panel itself is landscape before first boot. Portrait-shaped overrides
            # (800x1280, 360x640) DO work post-boot and keep the wm path below.
            printf 'hw.lcd.width=%s\nhw.lcd.height=%s\nhw.lcd.density=420\n' "$([ '${{ matrix.profile.viewport }}' = landscape-2340x1080 ] && echo 2340 || echo 1080)" "$([ '${{ matrix.profile.viewport }}' = landscape-2340x1080 ] && echo 1080 || echo 2340)" >> "$ANDROID_AVD_HOME/test.avd/config.ini"
          script: |
            set -eu
            mkdir -p apps/mobile/build
            adb wait-for-device
            adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done'
            adb shell wm dismiss-keyguard || true
            adb shell settings put global window_animation_scale 1.0
            adb shell settings put global transition_animation_scale 1.0
            adb shell settings put global animator_duration_scale 1.0
            # ONE LINE: the runner executes this field line-by-line (sh -c
            # per line) — the assert loop runs inside the device shell.
            adb shell 'for s in window_animation_scale transition_animation_scale animator_duration_scale; do v=$(settings get global $s); if [ "$v" != "1.0" ]; then echo "FAIL: $s=$v (expected 1.0)"; exit 1; fi; done'
            adb shell settings put global hide_error_dialogs 1
            adb shell settings put system font_scale '${{ matrix.profile.font_scale }}'
            test '${{ matrix.profile.viewport }}' != small-360x640 || adb shell wm size 360x640
            test '${{ matrix.profile.viewport }}' != small-360x640 || adb shell wm density 160
            test '${{ matrix.profile.viewport }}' != tablet-800x1280 || adb shell wm size 800x1280
            test '${{ matrix.profile.viewport }}' != tablet-800x1280 || adb shell wm density 160
            test '${{ matrix.profile.viewport }}' != landscape-2340x1080 || adb shell wm size 2340x1080
            sleep 4
            adb shell wm dismiss-keyguard || true
            adb install -r '${{ runner.temp }}/apk/Madarek-x86_64.apk'
            adb shell am start -n ly.madarek.mobile/.MainActivity
            sleep 20
            mkdir -p apps/mobile/build/screens
            adb exec-out screencap -p > apps/mobile/build/screens/launch-20s.png
            adb logcat -d > apps/mobile/build/screens/logcat-before-maestro.log
            printf 'role=%s\ntheme=%s\nfont_scale=%s\nviewport=%s\n' '${{ matrix.role }}' '${{ matrix.profile.theme }}' '${{ matrix.profile.font_scale }}' '${{ matrix.profile.viewport }}' > apps/mobile/build/screens/profile.txt
            adb shell dumpsys gfxinfo ly.madarek.mobile reset > /dev/null 2>&1 || true
            # ONE LINE (line-by-line runner): attempt 1 || one clean retry —
            # clearState makes the retry deterministic; a second failure is
            # a real red and stays red (the || group's exit code is the
            # retry's).
            maestro test "apps/mobile/.maestro/screens-${{ matrix.role }}.yaml" -e THEME_LABEL="${{ matrix.profile.theme_label }}" -e THEME_ID="${{ matrix.profile.theme }}" --test-output-dir apps/mobile/build/screens || { echo "::warning::maestro attempt 1 failed — one retry from clean app state"; adb shell am force-stop ly.madarek.mobile || true; sleep 3; maestro test "apps/mobile/.maestro/screens-${{ matrix.role }}.yaml" -e THEME_LABEL="${{ matrix.profile.theme_label }}" -e THEME_ID="${{ matrix.profile.theme }}" --test-output-dir apps/mobile/build/screens; }
            adb exec-out screencap -p > apps/mobile/build/screens/last-frame.png
            adb logcat -d > apps/mobile/build/screens/logcat-after-maestro.log
            adb shell dumpsys gfxinfo ly.madarek.mobile > apps/mobile/build/screens/gfxinfo.txt 2>&1 || true
            ls -l apps/mobile/build/screens || true
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screens-${{ github.run_number }}-${{ matrix.role }}-${{ matrix.profile.id }}
          path: apps/mobile/build/screens
          if-no-files-found: warn
          retention-days: 14
