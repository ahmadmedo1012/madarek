name: iOS — unsigned SideStore IPA

# Build a real-device, unsigned iOS IPA for SideStore.
#
# Pipeline: build (macOS) -> verify (Ubuntu, independent) -> publish (rolling
# prerelease `sidestore-latest`). The publish job only runs after the artifact
# has been downloaded again and re-verified from the artifact store.
#
# This workflow never uses EAS Build, never needs an Apple Developer account,
# and never signs the app. SideStore re-signs on-device with a free Apple ID.
#
# Native builds run when native inputs change. JS-only changes are delivered by
# the OTA job in mobile.yml; use workflow_dispatch for a self-contained rebuild.

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/package.json"
      - "apps/mobile/package-lock.json"
      - "apps/mobile/app.config.ts"
      - "apps/mobile/app.json"
      - "apps/mobile/eas.json"
      - "apps/mobile/assets/**"
      - "apps/mobile/plugins/**"
      - "apps/mobile/android/**"
      - "apps/mobile/ios/**"
      - "apps/mobile/.maestro/**"
      - "shared/**"
      - "apps/mobile/scripts/verify-ipa.py"
      - "apps/mobile/scripts/ci/**"
      - "scripts/ci/**"
      - ".github/workflows/build-ios-sidestore.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or commit SHA)"
        required: false
        default: "main"
  # R6 — the freshness safety net (same policy as Android's R3): a nightly
  # rebuild re-publishes from current main so `sidestore-latest` can never
  # go stale because of a missed trigger.
  schedule:
    - cron: '40 2 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-sidestore-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CI: "1"
  NODE_VERSION: "22"
  EXPO_NO_TELEMETRY: "1"
  COCOAPODS_DISABLE_STATS: "true"
  # Public build-time configuration (same value as eas.json). Not a secret.
  EXPO_PUBLIC_API_BASE_URL: "https://madarek-nine.vercel.app/api/v1"
  EXPO_UPDATES_CHANNEL: "production"
  IPA_NAME: "Madarek"
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  build:
    name: Build unsigned iPhoneOS IPA
    # macOS 26 (arm64), GitHub-hosted. Ships the Xcode 26.x / iOS SDK that
    # Expo SDK 58 / React Native 0.88 expect.
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/mobile/package-lock.json
            package-lock.json

      - name: Show toolchain and source revision
        run: |
          set -euo pipefail
          echo "Commit: $(git rev-parse HEAD)"
          echo "Subject: $(git log -1 --pretty=%s)"
          sw_vers
          echo "Host arch: $(uname -m)"
          xcode-select -p
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          pod --version
          node -v
          npm -v

      - name: Install JS dependencies from the lockfile
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund

      - name: Typecheck before the native build
        working-directory: apps/mobile
        run: npm run typecheck

      - name: Resolve and validate the Expo config
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          mkdir -p build
          npx expo config --type public --json > build/expo-config.json
          node scripts/ci/validate-expo-config.mjs --platform ios --config build/expo-config.json

      - name: Cache CocoaPods downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('apps/mobile/package-lock.json', 'apps/mobile/app.config.ts') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-

      - name: Generate the native iOS project (Expo prebuild)
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          rm -rf ios
          npx expo prebuild --platform ios --no-install 2>&1 | tee build/prebuild.log
          test -d ios
          echo "Generated native project:"
          for d in ios/*.xcodeproj ios/*.xcworkspace ios/Podfile; do
            [ -e "$d" ] && echo "$d"
          done

      - name: Install CocoaPods dependencies
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          mkdir -p build
          (cd ios && pod install) 2>&1 | tee build/pod-install.log
          test -f ios/Podfile.lock

      - name: Detect the Xcode workspace and scheme
        id: xcode
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          WORKSPACE=""
          for d in ios/*.xcworkspace; do
            if [ -d "$d" ]; then WORKSPACE="$d"; break; fi
          done
          PROJECT=""
          for d in ios/*.xcodeproj; do
            if [ -d "$d" ]; then PROJECT="$d"; break; fi
          done
          if [ -z "$WORKSPACE" ] || [ -z "$PROJECT" ]; then
            echo "::error::No .xcworkspace/.xcodeproj found after pod install"
            exit 1
          fi

          xcodebuild -list -workspace "$WORKSPACE" -json | tee build/xcode-list.json
          echo

          bundle_id_for_scheme() {
            xcodebuild -workspace "$WORKSPACE" -scheme "$1" \
              -configuration Release -sdk iphoneos \
              -showBuildSettings 2>/dev/null \
              | awk -F' = ' '/^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER = /{print $2; exit}' \
              || true
          }

          # Expo names the app scheme after the .xcodeproj. Never pick the
          # first scheme alphabetically: CocoaPods exposes dozens of schemes.
          PROJECT_SCHEME=$(basename "$PROJECT" .xcodeproj)
          SCHEME="$PROJECT_SCHEME"
          BID=$(bundle_id_for_scheme "$SCHEME")
          echo "Project scheme: $PROJECT_SCHEME (bundle id: ${BID:-<none>})"

          if [ "$BID" != "ly.madarek.mobile" ]; then
            echo "Project scheme did not resolve the app bundle id; scanning schemes..."
            SCHEME=""
            while IFS= read -r candidate; do
              [ -z "$candidate" ] && continue
              CANDIDATE_BID=$(bundle_id_for_scheme "$candidate")
              if [ "$CANDIDATE_BID" = "ly.madarek.mobile" ]; then
                SCHEME="$candidate"
                BID="$CANDIDATE_BID"
                break
              fi
            done < <(jq -r '(.workspace // .project).schemes[]?' build/xcode-list.json | grep -v '^Pods' || true)
          fi

          if [ -z "$SCHEME" ] || [ "$BID" != "ly.madarek.mobile" ]; then
            echo "::error::Could not find a scheme that builds ly.madarek.mobile"
            exit 1
          fi

          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME (bundle id: $BID)"

          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos \
            -showBuildSettings 2>/dev/null \
            | grep -E '^[[:space:]]*(PRODUCT_BUNDLE_IDENTIFIER|PRODUCT_NAME|PRODUCT_TYPE|IPHONEOS_DEPLOYMENT_TARGET)[[:space:]]*=' \
            | sort -u

      - name: Build Release for real iPhoneOS (unsigned)
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          mkdir -p build
          rm -rf build/Madarek.xcresult
          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build/DerivedData" \
            -resultBundlePath "$PWD/build/Madarek.xcresult" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee build/xcodebuild.log

      - name: Package Payload/App.app into an unsigned IPA
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          PRODUCTS="$PWD/build/DerivedData/Build/Products/Release-iphoneos"
          APP_PATH=""
          for d in "$PRODUCTS"/*.app; do
            if [ -d "$d" ]; then APP_PATH="$d"; break; fi
          done
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle found in $PRODUCTS"
            for d in "$PRODUCTS"/*; do [ -e "$d" ] && echo "$d"; done
            exit 1
          fi

          APP_BASENAME=$(basename "$APP_PATH")
          echo "Built app: $APP_PATH"
          echo "App bundle: $APP_BASENAME"

          rm -rf build/Payload
          mkdir -p build/Payload
          ditto "$APP_PATH" "build/Payload/$APP_BASENAME"

          # ditto preserves symlinks and extended attributes. Exactly one
          # top-level directory (Payload/) is inside the IPA.
          (cd build && ditto -c -k --keepParent Payload "$IPA_NAME.ipa")
          test -f "build/$IPA_NAME.ipa"
          echo "APP_BASENAME=$APP_BASENAME" >> "$GITHUB_ENV"

      - name: Verify the IPA with the committed verifier
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          python3 scripts/verify-ipa.py "build/$IPA_NAME.ipa" --json-out build/verify.json | tee build/verify.log

      - name: Write build metadata and checksums
        working-directory: apps/mobile
        env:
          REQUESTED_REF: ${{ github.event.inputs.ref || github.ref }}
        run: |
          set -euo pipefail
          XCODE_VERSION=$(xcodebuild -version | awk 'NR==1 {print $2}')
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          POD_VERSION=$(pod --version)
          COMMIT=$(git rev-parse HEAD)
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          jq -n \
            --arg platform "ios" \
            --arg name "$IPA_NAME" \
            --arg ipa "$IPA_NAME.ipa" \
            --arg commit "$COMMIT" \
            --arg requested_ref "$REQUESTED_REF" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg event_name "$GITHUB_EVENT_NAME" \
            --arg actor "$GITHUB_ACTOR" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_number "$GITHUB_RUN_NUMBER" \
            --arg run_url "$RUN_URL" \
            --arg runner "macos-26" \
            --arg runner_os "$RUNNER_OS" \
            --arg runner_arch "$RUNNER_ARCH" \
            --arg xcode "$XCODE_VERSION" \
            --arg ios_sdk "$IOS_SDK" \
            --arg cocoapods "$POD_VERSION" \
            --arg node "$(node -v)" \
            --arg npm "$(npm -v)" \
            --arg built_at "$BUILT_AT" \
            --arg updates_channel "${EXPO_UPDATES_CHANNEL:-}" \
            '{
              platform: $platform,
              name: $name,
              ipa: $ipa,
              commit: $commit,
              requested_ref: $requested_ref,
              repository: $repository,
              workflow: $workflow,
              event_name: $event_name,
              actor: $actor,
              run_id: $run_id,
              run_number: $run_number,
              run_url: $run_url,
              runner: $runner,
              runner_os: $runner_os,
              runner_arch: $runner_arch,
              xcode: $xcode,
              ios_sdk: $ios_sdk,
              cocoapods: $cocoapods,
              node: $node,
              npm: $npm,
              built_at: $built_at,
              updates_channel: $updates_channel,
              signed: false,
              verified: false
            }' > build/build-env.json

          jq -s '.[0] * .[1]' build/build-env.json build/verify.json > build/build-info.json
          (cd build && shasum -a 256 "$IPA_NAME.ipa" > SHA256SUMS.txt)

          echo "== build-info.json =="
          cat build/build-info.json
          echo "== SHA256SUMS.txt =="
          cat build/SHA256SUMS.txt

      - name: Upload the IPA candidate
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-candidate
          path: |
            apps/mobile/build/Madarek.ipa
            apps/mobile/build/build-info.json
            apps/mobile/build/SHA256SUMS.txt
            apps/mobile/build/verify.json
          if-no-files-found: error
          retention-days: 7

      # ── R6: the HERMETIC backend stack for the simulator smoke ─────
      # macOS runners have no service containers — Postgres comes from
      # Homebrew (bottle install, ~2 min), the backend from this commit.
      # The device IPA above keeps the production URL; the SIMULATOR build
      # below re-bundles JS with the hermetic base URL baked in.

      - name: Install and start PostgreSQL (Homebrew)
        run: |
          set -euo pipefail
          brew install postgresql@16
          brew services start postgresql@16
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 >/dev/null 2>&1; then
              echo "postgres ready (attempt $i)"
              break
            fi
            sleep 2
          done
          pg_isready -h localhost -p 5432
          createdb madarek_smoke
          echo "SMOKE_DATABASE_URL=postgresql://$(whoami)@localhost:5432/madarek_smoke" >> "$GITHUB_ENV"

      - name: Install backend dependencies (root workspaces)
        run: npm ci --no-audit --no-fund

      - name: Build the backend
        run: npm run build -w backend

      - name: Migrate + seed the smoke database
        run: |
          set -euo pipefail
          export DATABASE_URL="$SMOKE_DATABASE_URL"
          npm run db:deploy
          npm run db:seed

      - name: Boot the backend (background) and wait for health
        run: |
          set -euo pipefail
          mkdir -p apps/mobile/build
          DATABASE_URL="$SMOKE_DATABASE_URL" \
          JWT_ACCESS_SECRET="ci-only-access-secret-0123456789abcdef0123456789abcdef" \
          JWT_REFRESH_SECRET="ci-only-refresh-secret-0123456789abcdef0123456789abcd" \
          PORT=4000 \
          MADAREK_TEST_ACCOUNTS=1 \
          GIT_SHA="$(git rev-parse --short HEAD)" \
            nohup node backend/dist/server.js > apps/mobile/build/backend.log 2>&1 &
          echo $! > apps/mobile/build/backend.pid
          for i in $(seq 1 60); do
            BODY=$(curl -s --max-time 3 http://localhost:4000/api/v1/health || true)
            if echo "$BODY" | grep -q '"ok":true'; then
              echo "backend healthy after ${i} probes: $BODY"
              exit 0
            fi
            sleep 2
          done
          echo "::error::backend never became healthy; log tail:"
          tail -50 apps/mobile/build/backend.log
          exit 1

      - name: Allow local networking for the simulator build (ATS)
        # R6: the sim app talks to http://localhost:4000 — ATS blocks
        # cleartext to localhost by default. NSAllowsLocalNetworking is
        # scoped to local hosts only (production HTTPS unaffected), and
        # the patch lands AFTER the device IPA was packaged above.
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          PLIST=$(ls ios/*/Info.plist | head -1)
          test -n "$PLIST" && test -f "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :NSAppTransportSecurity dict' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity' "$PLIST"

      # ── R349 M1.2 — the simulator smoke (the crash-regression net) ──
      # Build the SAME Release code for the simulator (reusing the prebuilt
      # workspace + pods), boot a simulator, install the app, and run the
      # Maestro alive-flow: login -> dashboard count-ups (the EXACT surface
      # that SIGABRT'd ~15s after login on the owner's iPhone) -> assert
      # the process stays alive + interactive for a full 60s. Then scan for
      # crash reports — any .ips for ly.madarek.mobile fails the pipeline.
      - name: Build Release for the iOS Simulator (hermetic API)
        # R6: the STEP-scoped EXPO_PUBLIC_API_BASE_URL overrides the workflow
        # default for THIS bundle only — the simulator app talks to the
        # local backend; the device IPA above keeps production HTTPS.
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$PWD/build/DerivedDataSim" \
            -quiet \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee build/xcodebuild-sim.log
          test -d build/DerivedDataSim/Build/Products/Release-iphonesimulator

      # R6: the flow runs against the HERMETIC backend on this runner
      # (localhost:4000, same commit) — production is never a variable.
      - name: Boot a simulator and run the Maestro alive-flow
        working-directory: apps/mobile
        run: |
          set -euo pipefail

          # Pick the first available iPhone simulator (never watch/tv).
          DEVICE=$(xcrun simctl list devices available | grep -oE "iPhone [^(]*" | head -1 | xargs)
          [ -n "$DEVICE" ] || { echo "::error::No iPhone simulator available"; exit 1; }
          echo "Simulator: $DEVICE"
          UDID=$(xcrun simctl list devices available | grep "$DEVICE" | head -1 | grep -oE '[0-9A-F-]{36}' | head -1)
          [ -n "$UDID" ] || { echo "::error::Could not resolve simulator UDID"; exit 1; }

          # Mark the crash-report dir so we only flag NEW reports.
          CRASH_DIR="$HOME/Library/Logs/DiagnosticReports"
          mkdir -p "$CRASH_DIR"
          MARKER="$CRASH_DIR/.smoke-marker"
          touch "$MARKER"

          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b

          APP_SIM=""
          for d in build/DerivedDataSim/Build/Products/Release-iphonesimulator/*.app; do
            if [ -d "$d" ]; then APP_SIM="$d"; break; fi
          done
          [ -n "$APP_SIM" ] || { echo "::error::No simulator .app bundle"; exit 1; }
          xcrun simctl install "$UDID" "$APP_SIM"

          # Maestro drives the booted simulator by the flow's appId.
          curl -Ls "https://get.maestro.mobile.dev" | bash
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro --version

          if maestro test .maestro/smoke-alive.yaml --format junit --output build/maestro-junit.xml; then
            echo "alive-flow: PASS"
          else
            echo "::error::Maestro alive-flow FAILED — the app did not stay alive/interactive"
            # R349 (post-3½): the previous failure dumped only a log tail to
            # the step log — no screenshot, no artifact. Capture BOTH: the
            # pixel truth (simctl screenshot) and the app's own simulator
            # log window, so the next diagnosis reads the ACTUAL state.
            xcrun simctl io "$UDID" screenshot build/smoke-failure.png || true
            xcrun simctl spawn "$UDID" log show --last 10m --style compact 2>/dev/null | tail -400 > build/sim-log-tail.log || true
            exit 1
          fi

          echo "== Crash-report scan (ly.madarek.mobile .ips since the marker) =="
          NEW_IPS=$(find "$CRASH_DIR" -name "*.ips" -newer "$MARKER" 2>/dev/null | grep -i "madarek" | wc -l | tr -d ' ')
          if [ "$NEW_IPS" != "0" ]; then
            echo "::error::$NEW_IPS new crash report(s) for the app during the smoke"
            find "$CRASH_DIR" -name "*.ips" -newer "$MARKER" 2>/dev/null || true
            exit 1
          fi
          echo "Smoke green: 60s alive window held, zero crash reports."

      - name: Write the smoke result (R6)
        if: always()
        working-directory: apps/mobile
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p build
          RESULT="unknown"
          if [ -f build/maestro-junit.xml ] && ! grep -q '<failure' build/maestro-junit.xml; then
            RESULT="pass"
          elif [ -f build/maestro-junit.xml ]; then
            RESULT="fail"
          fi
          jq -n --arg result "$RESULT" \
            --arg api "hermetic (localhost:4000, same-commit backend)" \
            --arg run_url "$RUN_URL" \
            --arg commit "$(git rev-parse HEAD)" \
            '{smoke: $result, api: $api, run_url: $run_url, commit: $commit}' \
            > build/smoke-result.json
          cat build/smoke-result.json
          if [ "$RESULT" != "pass" ]; then
            echo "::error::smoke result: $RESULT (recorded; publish proceeds on verify per R6 policy)"
            exit 1
          fi

      - name: Upload smoke result (R6)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke-result
          path: apps/mobile/build/smoke-result.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke-diagnostics-${{ github.run_number }}
          path: |
            apps/mobile/build/xcodebuild-sim.log
            apps/mobile/build/maestro-junit.xml
            apps/mobile/build/smoke-failure.png
            apps/mobile/build/sim-log-tail.log
            ~/Library/Logs/DiagnosticReports/*.ips
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs-${{ github.run_number }}
          path: |
            apps/mobile/build/prebuild.log
            apps/mobile/build/pod-install.log
            apps/mobile/build/xcode-list.json
            apps/mobile/build/xcodebuild.log
            apps/mobile/build/Madarek.xcresult
            apps/mobile/build/expo-config.json
            apps/mobile/build/verify.log
            apps/mobile/ios/Podfile.lock
          if-no-files-found: ignore
          retention-days: 14

  verify:
    name: Verify IPA independently (Linux)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout verifier
        uses: actions/checkout@v4
        with:
          sparse-checkout: apps/mobile/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download the IPA candidate
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa-candidate
          path: candidate

      - name: Re-verify the downloaded IPA
        run: |
          set -euo pipefail
          python3 apps/mobile/scripts/verify-ipa.py candidate/Madarek.ipa \
            --json-out candidate/verify-rerun.json | tee candidate/verify.log

      - name: Cross-check metadata and publish the verified artifact
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          SHA=$(sha256sum candidate/Madarek.ipa | awk '{print $1}')
          SIZE=$(stat -c%s candidate/Madarek.ipa)
          jq -e \
            --arg sha "$SHA" \
            --argjson size "$SIZE" \
            '.platform == "ios" and .sha256 == $sha and .size_bytes == $size and .bundle_identifier == "ly.madarek.mobile" and .unsigned == true and .verified == false' \
            candidate/build-info.json >/dev/null

          mkdir -p verified
          cp candidate/Madarek.ipa verified/Madarek.ipa
          jq -s \
            --arg verified_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg run_url "$RUN_URL" \
            --arg verifier "apps/mobile/scripts/verify-ipa.py" \
            '.[0] * .[1] * {verified:true, verified_at:$verified_at, verify_run_url:$run_url, verifier:$verifier}' \
            candidate/build-info.json candidate/verify-rerun.json > verified/build-info.json
          cp candidate/verify-rerun.json verified/verify.json
          (cd verified && sha256sum Madarek.ipa > SHA256SUMS.txt)

          echo "Verified SHA-256: $SHA"
          cat verified/SHA256SUMS.txt

      - name: Upload the verified IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madarek-unsigned-ipa
          path: |
            verified/Madarek.ipa
            verified/SHA256SUMS.txt
            verified/build-info.json
            verified/verify.json
          if-no-files-found: error
          retention-days: 30

      - name: Write verification summary
        run: |
          set -euo pipefail
          {
            echo "## iOS IPA verified"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Bundle | \`$(jq -r .bundle_identifier verified/build-info.json)\` |"
            echo "| Version | \`$(jq -r .version verified/build-info.json)\` (\`$(jq -r .build_number verified/build-info.json)\`) |"
            echo "| SHA-256 | \`$(jq -r .sha256 verified/build-info.json)\` |"
            echo "| Size | $(jq -r .size_bytes verified/build-info.json) bytes |"
            echo "| Mach-O | $(jq -r .mach_o_platform verified/build-info.json), $(jq -r '.architectures|join(", ")' verified/build-info.json) |"
            echo "| Verified | $(jq -r .verified_at verified/build-info.json) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-verify-diagnostics-${{ github.run_number }}
          path: |
            candidate/verify.log
            candidate/verify-rerun.json
            candidate/build-info.json
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish rolling SideStore release
    needs: verify
    # R6: same policy as Android R3 — verify gates the publish; the smoke
    # result is merged into build-info.json and badged in the notes; a red
    # smoke job makes the run loud without blocking the IPA; the nightly
    # schedule publishes exactly like a push on main.
    if: >-
      always() &&
      needs.verify.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event.inputs.ref == 'main' || github.event.inputs.ref == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download the verified IPA
        uses: actions/download-artifact@v4
        with:
          name: Madarek-unsigned-ipa
          path: verified

      - name: Download the smoke result (if produced)
        uses: actions/download-artifact@v4
        with:
          name: ios-smoke-result
          path: smoke
        continue-on-error: true

      - name: Merge the smoke result into build-info (R6)
        run: |
          set -euo pipefail
          if [ -f smoke/smoke-result.json ]; then
            SMOKE=$(jq -r .smoke smoke/smoke-result.json)
            SMOKE_URL=$(jq -r .run_url smoke/smoke-result.json)
          else
            SMOKE="unknown"; SMOKE_URL=""
          fi
          echo "smoke: $SMOKE"
          jq --arg smoke "$SMOKE" --arg smoke_url "$SMOKE_URL" \
             '. * {smoke: $smoke, smoke_run_url: $smoke_url}' \
             verified/build-info.json > verified/build-info.tmp.json
          mv verified/build-info.tmp.json verified/build-info.json

      - name: Render release notes
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/ci/render-mobile-release-notes.py \
            --platform ios \
            --build-info verified/build-info.json \
            --repo "$GITHUB_REPOSITORY" \
            --tag sidestore-latest \
            --run-url "$RUN_URL" > release-notes.md
          SMOKE=$(jq -r '.smoke // "unknown"' verified/build-info.json)
          SMOKE_URL=$(jq -r '.smoke_run_url // ""' verified/build-info.json)
          case "$SMOKE" in
            pass) BADGE="✅ simulator smoke: PASS (hermetic backend)" ;;
            fail) BADGE="⚠️ simulator smoke: FAIL — $SMOKE_URL" ;;
            *) BADGE="⚠️ simulator smoke: not run/unknown" ;;
          esac
          printf '\n---\n\n%s\n' "$BADGE" >> release-notes.md
          cat release-notes.md

      - name: Publish/update sidestore-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          COMMIT=$(jq -r .commit verified/build-info.json)
          bash scripts/ci/publish-rolling-release.sh \
            sidestore-latest \
            "Madarek.ipa — latest unsigned SideStore build" \
            release-notes.md \
            "$COMMIT" \
            verified/Madarek.ipa \
            verified/SHA256SUMS.txt \
            verified/build-info.json

      - name: Write release summary
        run: |
          set -euo pipefail
          {
            echo "## SideStore release updated"
            echo
            echo "**Stable IPA:** https://github.com/$GITHUB_REPOSITORY/releases/download/sidestore-latest/Madarek.ipa"
            echo
            echo "**Build:** $(jq -r '.version' verified/build-info.json) ($(jq -r '.build_number' verified/build-info.json))"
            echo
            echo "**SHA-256:** \`$(jq -r '.sha256' verified/build-info.json)\`"
            echo
            echo "**Commit:** \`$(jq -r '.commit' verified/build-info.json)\`"
          } >> "$GITHUB_STEP_SUMMARY"
