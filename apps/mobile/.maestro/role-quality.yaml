# role-quality — أخصائي جودة: دخول ← تبويبات ← خروج عبر رابط عميق.
appId: ly.madarek.mobile
name: "05 — جودة: دخول، تبويبات، خروج"
---
- launchApp
- tapOn: "تسجيل الدخول"
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 30000
- tapOn:
    id: "login-email"
- inputText: "quality@test.ly"
- tapOn:
    id: "login-password"
- inputText: "12345678"
- hideKeyboard
- tapOn: "دخول"
- extendedWaitUntil:
    visible: "المقررات"
    timeout: 120000
- tapOn: "المقررات"
- tapOn: "المناهج"
- extendedWaitUntil:
    visible: "التقارير"
    timeout: 30000
- openLink: "madarek://settings"
- extendedWaitUntil:
    visible: "تسجيل الخروج"
    timeout: 30000
- tapOn: "تسجيل الخروج"
- tapOn: "خروج"
- extendedWaitUntil:
    visible: "منصّة التعليم الذكي"
    timeout: 60000
