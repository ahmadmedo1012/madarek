# R358 role capture: quality; selected appearance is set through account settings.
appId: ly.madarek.mobile
name: "R358 screens — quality"
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "welcome-title"
    timeout: 120000
- scrollUntilVisible:
    element:
      id: "welcome-cta"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "welcome-cta"
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 30000
- tapOn:
    id: "login-email"
- inputText: "quality@test.ly"
- tapOn:
    id: "login-password"
- inputText: "12345678"
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible:
      id: "tab-dashboard"
    timeout: 120000
- openLink: "madarek://settings"
- extendedWaitUntil:
    visible: "الإعدادات"
    timeout: 30000
- tapOn: "${THEME_LABEL}"
- openLink: "madarek://quality/dashboard"
- extendedWaitUntil:
    visible:
      id: "role-tab-bar"
    timeout: 30000
- takeScreenshot: "screens/quality-01-dashboard"
- tapOn:
    id: "tab-courses"
- extendedWaitUntil:
    visible:
      id: "tab-courses"
    timeout: 30000
- takeScreenshot: "screens/quality-02-courses"
- tapOn:
    id: "tab-curriculum"
- extendedWaitUntil:
    visible:
      id: "tab-curriculum"
    timeout: 30000
- takeScreenshot: "screens/quality-03-curriculum"
- tapOn:
    id: "tab-engagement"
- extendedWaitUntil:
    visible:
      id: "tab-engagement"
    timeout: 30000
- takeScreenshot: "screens/quality-04-engagement"
- tapOn:
    id: "tab-reports"
- extendedWaitUntil:
    visible:
      id: "tab-reports"
    timeout: 30000
- takeScreenshot: "screens/quality-05-reports"
