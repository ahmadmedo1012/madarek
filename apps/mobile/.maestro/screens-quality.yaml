# R358 role capture: quality; selected appearance is set through account settings.
appId: ly.madarek.mobile
name: "R358 screens — quality"
---
# R362 — clearState: every run starts from the welcome sheet (fresh
# session + default light theme), which makes a flaky-emulator RETRY
# possible (a warm relaunch would land on the dashboard and fail the
# very first assertion). Matches smoke-alive's cold-boot pattern.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "welcome-title"
    timeout: 120000
- takeScreenshot: "screens/00-welcome"
- scrollUntilVisible:
    element:
      id: "welcome-cta"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "welcome-cta"
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 30000
- takeScreenshot: "screens/01-login"
- tapOn:
    id: "login-email"
- inputText: "quality@test.ly"
- hideKeyboard
- tapOn:
    id: "login-password"
- inputText: "12345678"
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible:
      id: "tab-dashboard"
    timeout: 120000
- openLink: "madarek://settings"
- extendedWaitUntil:
    visible:
      id: "settings-title"
    timeout: 30000
- takeScreenshot: "screens/02-settings-before-theme"
- openLink: "madarek://settings?theme=__THEME__"
# R362 — the applied-theme evidence: the settings screen re-renders in
# the new theme instantly (zustand, no reload); this shot + the
# before-shot are the pair a reviewer compares. The wait also proves
# the theme switch did not unmount the screen (its own regression
# class from R358's seg-tap fix).
- extendedWaitUntil:
    visible:
      id: "settings-title"
    timeout: 10000
- takeScreenshot: "screens/03-settings-after-theme"
- openLink: "madarek://quality/dashboard"
- extendedWaitUntil:
    visible:
      id: "role-tab-bar"
    timeout: 30000
- takeScreenshot: "screens/quality-03-dashboard"
- tapOn:
    id: "tab-courses"
- extendedWaitUntil:
    visible:
      id: "tab-courses"
    timeout: 30000
- takeScreenshot: "screens/quality-04-courses"
- tapOn:
    id: "tab-curriculum"
- extendedWaitUntil:
    visible:
      id: "tab-curriculum"
    timeout: 30000
- takeScreenshot: "screens/quality-05-curriculum"
- tapOn:
    id: "tab-engagement"
- extendedWaitUntil:
    visible:
      id: "tab-engagement"
    timeout: 30000
- takeScreenshot: "screens/quality-06-engagement"
- tapOn:
    id: "tab-reports"
- extendedWaitUntil:
    visible:
      id: "tab-reports"
    timeout: 30000
- takeScreenshot: "screens/quality-07-reports"

# R366 A5 — the deep-stop walk: every primary pushed surface per
# role, reached by deep link. Screenshot after the route settles
# (no fragile Arabic-text assertions — the shot IS the evidence).
- openLink: "madarek://quality/professors"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: "screens/quality-08-professors"

- openLink: "madarek://quality/exam-moderation"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: "screens/quality-09-exam-moderation"

- openLink: "madarek://quality/alerts"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: "screens/quality-10-alerts"
