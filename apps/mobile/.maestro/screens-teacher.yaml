# R358 role capture: teacher; selected appearance is set through account settings.
appId: ly.madarek.mobile
name: "R358 screens — teacher"
---
# R362 — clearState: every run starts from the welcome sheet (fresh
# session + default light theme), which makes a flaky-emulator RETRY
# possible (a warm relaunch would land on the dashboard and fail the
# very first assertion). Matches smoke-alive's cold-boot pattern.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "welcome-title"
    timeout: 120000
- takeScreenshot: "screens/00-welcome"
- scrollUntilVisible:
    element:
      id: "welcome-cta"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "welcome-cta"
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 30000
- takeScreenshot: "screens/01-login"
- tapOn:
    id: "login-email"
- inputText: "teacher@test.ly"
- hideKeyboard
- tapOn:
    id: "login-password"
- inputText: "12345678"
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible:
      id: "tab-dashboard"
    timeout: 120000
- openLink: "madarek://settings"
- extendedWaitUntil:
    visible:
      id: "settings-title"
    timeout: 30000
- takeScreenshot: "screens/02-settings-before-theme"
- tapOn:
    id: "seg-${THEME_ID}"
# R362 — the applied-theme evidence: the settings screen re-renders in
# the new theme instantly (zustand, no reload); this shot + the
# before-shot are the pair a reviewer compares. The wait also proves
# the theme switch did not unmount the screen (its own regression
# class from R358's seg-tap fix).
- extendedWaitUntil:
    visible:
      id: "settings-title"
    timeout: 10000
- takeScreenshot: "screens/03-settings-after-theme"
- openLink: "madarek://teacher/dashboard"
- extendedWaitUntil:
    visible:
      id: "role-tab-bar"
    timeout: 30000
- takeScreenshot: "screens/teacher-03-dashboard"
- tapOn:
    id: "tab-schedule"
- extendedWaitUntil:
    visible:
      id: "tab-schedule"
    timeout: 30000
- takeScreenshot: "screens/teacher-04-schedule"
- tapOn:
    id: "tab-students"
- extendedWaitUntil:
    visible:
      id: "tab-students"
    timeout: 30000
- takeScreenshot: "screens/teacher-05-students"
- tapOn:
    id: "tab-intelligence"
- extendedWaitUntil:
    visible:
      id: "tab-intelligence"
    timeout: 30000
- takeScreenshot: "screens/teacher-06-intelligence"
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible:
      id: "tab-profile"
    timeout: 30000
- takeScreenshot: "screens/teacher-07-profile"
