# R358 role capture: registrar; selected appearance is set through account settings.
appId: ly.madarek.mobile
name: "R358 screens — registrar"
---
# R362 — clearState: every run starts from the welcome sheet (fresh
# session + default light theme), which makes a flaky-emulator RETRY
# possible (a warm relaunch would land on the dashboard and fail the
# very first assertion). Matches smoke-alive's cold-boot pattern.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "welcome-title"
    timeout: 120000
- takeScreenshot: "screens/00-welcome"
- scrollUntilVisible:
    element:
      id: "welcome-cta"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "welcome-cta"
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 30000
- takeScreenshot: "screens/01-login"
- tapOn:
    id: "login-email"
- inputText: "registrar@test.ly"
- hideKeyboard
- tapOn:
    id: "login-password"
- inputText: "12345678"
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible:
      id: "tab-dashboard"
    timeout: 120000
- openLink: "madarek://settings"
- extendedWaitUntil:
    visible:
      id: "settings-title"
    timeout: 30000
- takeScreenshot: "screens/02-settings-before-theme"
- tapOn:
    id: "seg-${THEME_ID}"
# R362 — the applied-theme evidence: the settings screen re-renders in
# the new theme instantly (zustand, no reload); this shot + the
# before-shot are the pair a reviewer compares. The wait also proves
# the theme switch did not unmount the screen (its own regression
# class from R358's seg-tap fix).
- extendedWaitUntil:
    visible:
      id: "settings-title"
    timeout: 10000
- takeScreenshot: "screens/03-settings-after-theme"
- openLink: "madarek://admin/dashboard"
- extendedWaitUntil:
    visible:
      id: "role-tab-bar"
    timeout: 30000
- takeScreenshot: "screens/registrar-03-dashboard"
- tapOn:
    id: "tab-faculties"
- extendedWaitUntil:
    visible:
      id: "tab-faculties"
    timeout: 30000
- takeScreenshot: "screens/registrar-04-faculties"
- tapOn:
    id: "tab-students"
- extendedWaitUntil:
    visible:
      id: "tab-students"
    timeout: 30000
- takeScreenshot: "screens/registrar-05-students"
- tapOn:
    id: "tab-teachers"
- extendedWaitUntil:
    visible:
      id: "tab-teachers"
    timeout: 30000
- takeScreenshot: "screens/registrar-06-teachers"
- tapOn:
    id: "tab-reports"
- extendedWaitUntil:
    visible:
      id: "tab-reports"
    timeout: 30000
- takeScreenshot: "screens/registrar-07-reports"

# R366 A5 — the deep-stop walk: every primary pushed surface per
# role, reached by deep link. Screenshot after the route settles
# (no fragile Arabic-text assertions — the shot IS the evidence).
- openLink: "madarek://admin/courses"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: "screens/registrar-08-courses"

- openLink: "madarek://admin/invites"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: "screens/registrar-09-invites"

- openLink: "madarek://admin/directory"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: "screens/registrar-10-directory"

- openLink: "madarek://admin/alerts"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: "screens/registrar-11-alerts"

- openLink: "madarek://admin/feedback"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: "screens/registrar-12-feedback"

- openLink: "madarek://admin/digital"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: "screens/registrar-13-digital"
