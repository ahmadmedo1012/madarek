# role-teacher — أستاذ: دخول ← تبويبات ← خروج.
# Full cycle for the TEACHER role.
appId: ly.madarek.mobile
name: "03 — أستاذ: دخول، تبويبات، خروج"
---
- launchApp
- tapOn: "تسجيل الدخول"
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 30000
- tapOn:
    id: "login-email"
- inputText: "teacher@test.ly"
- tapOn:
    id: "login-password"
- inputText: "12345678"
- hideKeyboard
- tapOn: "دخول"
- extendedWaitUntil:
    visible: "الجدول"
    timeout: 120000
- tapOn: "الطلاب"
- extendedWaitUntil:
    visible: "التحليلات"
    timeout: 30000
- tapOn: "التحليلات"
- tapOn: "حسابي"
- extendedWaitUntil:
    visible: "الإعدادات"
    timeout: 30000
- tapOn: "الإعدادات"
- extendedWaitUntil:
    visible: "تسجيل الخروج"
    timeout: 30000
- tapOn: "تسجيل الخروج"
- tapOn: "خروج"
- extendedWaitUntil:
    visible: "منصّة التعليم الذكي"
    timeout: 60000
