# R358 role capture: owner; selected appearance is set through account settings.
appId: ly.madarek.mobile
name: "R358 screens — owner"
---
# R362 — clearState: every run starts from the welcome sheet (fresh
# session + default light theme), which makes a flaky-emulator RETRY
# possible (a warm relaunch would land on the dashboard and fail the
# very first assertion). Matches smoke-alive's cold-boot pattern.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "welcome-title"
    timeout: 120000
- takeScreenshot: "screens/00-welcome"
- scrollUntilVisible:
    element:
      id: "welcome-cta"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "welcome-cta"
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 30000
- takeScreenshot: "screens/01-login"
- tapOn:
    id: "login-email"
- inputText: "owner@test.ly"
- hideKeyboard
- tapOn:
    id: "login-password"
- inputText: "12345678"
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible:
      id: "tab-dashboard"
    timeout: 120000
- openLink: "madarek://settings"
- extendedWaitUntil:
    visible:
      id: "settings-title"
    timeout: 30000
- takeScreenshot: "screens/02-settings-before-theme"
- openLink: "madarek://settings?theme=__THEME__"
# R362 — the applied-theme evidence: the settings screen re-renders in
# the new theme instantly (zustand, no reload); this shot + the
# before-shot are the pair a reviewer compares. The wait also proves
# the theme switch did not unmount the screen (its own regression
# class from R358's seg-tap fix).
- extendedWaitUntil:
    visible:
      id: "settings-title"
    timeout: 10000
- takeScreenshot: "screens/03-settings-after-theme"
- openLink: "madarek://owner/dashboard"
- extendedWaitUntil:
    visible:
      id: "role-tab-bar"
    timeout: 30000
- takeScreenshot: "screens/owner-03-dashboard"
- tapOn:
    id: "tab-users"
- extendedWaitUntil:
    visible:
      id: "tab-users"
    timeout: 30000
- takeScreenshot: "screens/owner-04-users"
- tapOn:
    id: "tab-realtime"
- extendedWaitUntil:
    visible:
      id: "tab-realtime"
    timeout: 30000
- takeScreenshot: "screens/owner-05-realtime"
- tapOn:
    id: "tab-notifications"
- extendedWaitUntil:
    visible:
      id: "tab-notifications"
    timeout: 30000
- takeScreenshot: "screens/owner-06-notifications"
- tapOn:
    id: "tab-governance"
- extendedWaitUntil:
    visible:
      id: "tab-governance"
    timeout: 30000
- takeScreenshot: "screens/owner-07-governance"

# R366 A5 — the deep-stop walk: every primary pushed surface per
# role, reached by deep link. Screenshot after the route settles
# (no fragile Arabic-text assertions — the shot IS the evidence).
- openLink: "madarek://owner/institutions"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: "screens/owner-08-institutions"

- openLink: "madarek://owner/content"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: "screens/owner-09-content"

- openLink: "madarek://owner/system"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: "screens/owner-10-system"

- openLink: "madarek://owner/activity"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: "screens/owner-11-activity"

- openLink: "madarek://owner/ai"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: "screens/owner-12-ai"

- openLink: "madarek://owner/alerts"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: "screens/owner-13-alerts"

- openLink: "madarek://owner/education"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: "screens/owner-14-education"

- openLink: "madarek://owner/feedback"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: "screens/owner-15-feedback"
