# first-open — أولاً: يفتح التطبيق بارداً ولا ينهار.
# The very first proof: cold launch reaches the welcome sheet.
# R362 — the anchors are IDS now: the old text anchors («منصّة التعليم
# الذكي» + «تسجيل الدخول») died with the R345 welcome redesign (the
# subtitle moved to the login screen; the CTA is «ابدأ الآن»), and RTL
# text matching is unreliable on Maestro-Android anyway (smoke-alive's
# documented law — ids only).
appId: ly.madarek.mobile
name: "01 — أول فتح (بدون انهيار)"
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "welcome-title"
    timeout: 60000
- assertVisible:
    id: "welcome-cta"
