# role-registrar — المسجل العام (ADMIN): دخول ← تبويبات ← خروج عبر رابط عميق.
# ADMIN has no profile tab (B3 backlog) → logout reaches /settings via the
# madarek:// deep link, which doubles as the deep-link proof.
appId: ly.madarek.mobile
name: "04 — مسجل عام: دخول، تبويبات، خروج"
---
- launchApp
- tapOn: "تسجيل الدخول"
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 30000
- tapOn:
    id: "login-email"
- inputText: "registrar@test.ly"
- tapOn:
    id: "login-password"
- inputText: "12345678"
- hideKeyboard
- tapOn: "دخول"
- extendedWaitUntil:
    visible: "الكلّيات"
    timeout: 120000
- tapOn: "الكلّيات"
- tapOn: "الطلاب"
- extendedWaitUntil:
    visible: "الأساتذة"
    timeout: 30000
- openLink: "madarek://settings"
- extendedWaitUntil:
    visible: "تسجيل الخروج"
    timeout: 30000
- tapOn: "تسجيل الخروج"
- tapOn: "خروج"
- extendedWaitUntil:
    visible: "منصّة التعليم الذكي"
    timeout: 60000
