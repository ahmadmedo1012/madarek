# R358 role capture: student; selected appearance is set through account settings.
appId: ly.madarek.mobile
name: "R358 screens — student"
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "welcome-title"
    timeout: 120000
- scrollUntilVisible:
    element:
      id: "welcome-cta"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "welcome-cta"
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 30000
- tapOn:
    id: "login-email"
- inputText: "student@test.ly"
- tapOn:
    id: "login-password"
- hideKeyboard
- inputText: "12345678"
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible:
      id: "tab-dashboard"
    timeout: 120000
- openLink: "madarek://settings"
- extendedWaitUntil:
    visible: "الإعدادات"
    timeout: 30000
- tapOn: "${THEME_LABEL}"
- openLink: "madarek://student/dashboard"
- extendedWaitUntil:
    visible:
      id: "role-tab-bar"
    timeout: 30000
- takeScreenshot: "screens/student-01-dashboard"
- tapOn:
    id: "tab-courses"
- extendedWaitUntil:
    visible:
      id: "tab-courses"
    timeout: 30000
- takeScreenshot: "screens/student-02-courses"
- tapOn:
    id: "tab-ai"
- extendedWaitUntil:
    visible:
      id: "tab-ai"
    timeout: 30000
- takeScreenshot: "screens/student-03-ai"
- tapOn:
    id: "tab-alerts"
- extendedWaitUntil:
    visible:
      id: "tab-alerts"
    timeout: 30000
- takeScreenshot: "screens/student-04-alerts"
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible:
      id: "tab-profile"
    timeout: 30000
- takeScreenshot: "screens/student-05-profile"
