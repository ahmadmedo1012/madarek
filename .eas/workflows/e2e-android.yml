# EAS Workflow — Maestro e2e on Android (R327 A1).
#
# build (preview profile = internal APK) → maestro job boots an emulator,
# installs the APK, and runs every flow in apps/mobile/.maestro/ (first
# open + login for all five roles → tabs → logout). Screen recording ON.
name: e2e-android
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/.maestro/**'
      - '.eas/workflows/e2e-android.yml'
  workflow_dispatch: {}

jobs:
  build-android-apk:
    name: Build (preview — Android APK)
    type: build
    params:
      platform: android
      profile: preview
      message: "R327 e2e-android — Maestro flows"

  maestro-android:
    name: Maestro e2e — Android emulator
    type: maestro
    needs: [build-android-apk]
    params:
      build_id: ${{ needs.build-android-apk.outputs.build_id }}
      flow_path: apps/mobile/.maestro
      record_screen: true
      retries: 1
      output_format: junit
