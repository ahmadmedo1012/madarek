services:
  - type: web
    name: madarek
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    # `--include=dev` is required because Render sets NODE_ENV=production
    # before `npm install` runs, which would otherwise skip devDependencies
    # (typescript, vite, @types/*, prisma CLI, …) that we need for the build.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
