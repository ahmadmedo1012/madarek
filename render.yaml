services:
  - type: web
    name: madarek
    runtime: node
    plan: free
    # virginia (us-east-1) — co-located with the Neon PostgreSQL primary,
    # so API queries avoid a cross-country round trip on every request.
    region: virginia
    rootDir: .
    # NOTE on storage: Render's filesystem is ephemeral. PDF uploads ARE
    # implemented now (POST /api/v1/files/papers, POST /api/v1/offerings/:id/
    # materials/file) and land behind the storage abstraction
    # (backend/src/lib/storage.ts). With the default local driver those files
    # are LOST on every redeploy/restart — the backend logs one clear warning
    # at boot in that case. For persistence EITHER attach a Render persistent
    # disk (a `disk:` block, paid plans only) OR set STORAGE_DRIVER=s3 + the
    # S3_* vars (any S3-compatible store: AWS S3, Cloudflare R2, MinIO) OR set
    # STORAGE_DRIVER=postgres (r175 pilot mode: BYTEA rows in the app's own
    # Postgres — zero extra infrastructure, the choice for the free plan) —
    # see docs/12-deployment.md for exact owner steps.
    # `--include=dev` is required because Render sets NODE_ENV=production
    # before `npm install` runs, which would otherwise skip devDependencies
    # (typescript, vite, @types/*, prisma CLI, …) that we need for the build.
    # `npm ci` (not install) keeps the deployed artifact byte-identical to
    # what the committed package-lock.json was CI-tested against.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Pin the runtime Node major to 22 — the LTS line in support (Node
      # 20 reached EOL in April 2026) and EXACTLY what CI pins
      # (.github/workflows/ci.yml env.NODE_VERSION), inside the engines
      # range >=20 <25. Without this pin Render uses its own default
      # Node version, which can drift from the version the committed
      # package-lock.json was CI-tested against (docs/16 row closed in
      # r164-l).
      - key: NODE_VERSION
        value: '22'
      # Pin the runtime clock to UTC — the backend's timezone model
      # (backend/src/lib/dates.ts) computes date-only day-keys on the UTC
      # calendar and renders display labels in Africa/Tripoli; a drifting
      # host TZ would split/merge attendance days at the wrong boundary.
      - key: TZ
        value: UTC
      - key: DATABASE_URL
        sync: false
      # generateValue produces 32-char secrets — exactly env.ts's min(32).
      # Raising that floor would break every existing deployment's boot.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Optional vars — defaults/fail-closed behavior lives in
      # backend/src/env.ts; sync:false so Render never requires them.
      - key: CORS_ORIGINS
        sync: false
      - key: INTERNAL_SERVICE_TOKEN
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      # File-storage vars (PDF uploads). All optional: unset → local driver
      # under backend/storage (ephemeral on Render — see the storage NOTE
      # above). Set STORAGE_DRIVER=s3 + the S3_* group for persistence;
      # sync:false so Render never requires any of them.
      - key: STORAGE_DRIVER
        sync: false
      - key: STORAGE_DIR
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # AI-provider vars (chat assistant). All optional: unset → 'local'
      # mode (in-process mastery-aware templates, zero external calls).
      # Set AI_PROVIDER=openai + AI_API_KEY + AI_MODEL for a real
      # OpenAI-compatible LLM; AI_BASE_URL defaults to OpenAI's v1.
      # sync:false so Render never requires any of them. AI_MODELS
      # (r176i) is the optional ordered OpenRouter free-models list
      # (≤3 ids, comma-separated) — when set it replaces the bare
      # router id on the wire so routing stays inside vetted chat
      # models; per-response attribution is unaffected.
      - key: AI_PROVIDER
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_MODELS
        sync: false
      # R320 §C — boot-time test-account ensure. ON while the project is
      # in development (the owner's convenience bar: one easy account per
      # job, @test.ly / 12345678 — shared/testAccounts.ts). Idempotent
      # create-or-HEAL upserts (password, lock state, scope, display
      # name) on the 10 documented accounts ONLY; non-fatal on error.
      # Deploy-time `npm run db:seed` (root build) already ensures the
      # accounts — this belt also heals a locked/renamed account on
      # every boot/restart. Turn OFF for launch by removing the value.
      - key: MADAREK_TEST_ACCOUNTS
        value: '1'
